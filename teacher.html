<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | VocalClass</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="logo">Vocal<span>Class</span></div><div class="row"><span id="teacherName" class="badge">Loading...</span><a class="btn secondary" href="admin.html">Admin</a><button id="logout">Logout</button></div></header><main class="wrap"><div id="message" class="message"></div><section class="grid"><div class="card"><h1>Create classroom</h1><label>Class name</label><input id="className"><label>Subject</label><input id="subject"><label>Description</label><textarea id="description" maxlength="500"></textarea><button id="create" class="green" style="margin-top:16px;width:100%">Create classroom</button></div><div class="card"><h2>Profile</h2><p id="profile" class="muted"></p><label>Open by code</label><input id="joinCode" maxlength="6"><button id="openCode" style="margin-top:12px">Open classroom</button></div></section><section class="grid" style="margin-top:22px"><div class="panel"><h2>Active classrooms</h2><div id="active" class="list"></div></div><div class="panel"><h2>Previous classrooms</h2><div id="previous" class="list"></div></div></section></main><script type="module">
import { collection,addDoc,doc,setDoc,query,where,onSnapshot,serverTimestamp,getDocs,updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db, requireRole, logout, classroomCode, showMessage, friendlyError } from "./app-utils.js";
let me,profile;document.getElementById('logout').onclick=logout;({user:me,profile}=await requireRole(['teacher'],{redirect:'teacher-login.html'}));document.getElementById('teacherName').textContent=profile.name||me.email;document.getElementById('profile').textContent=`${profile.name||'Teacher'} • ${profile.email||me.email} • Approved teacher`;
document.getElementById('create').onclick=async()=>{try{const name=document.getElementById('className').value.trim();const subject=document.getElementById('subject').value.trim();const description=document.getElementById('description').value.trim();if(!name||!subject)return showMessage('message','Class name and subject are required.','error');const code=classroomCode();const room=await addDoc(collection(db,'classrooms'),{name,subject,description,code,teacherId:me.uid,teacherName:profile.name||me.email,status:'active',currentSlide:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await setDoc(doc(db,'classrooms',room.id,'members',me.uid),{uid:me.uid,displayName:profile.name||me.email,role:'teacher',status:'active',joinedAt:serverTimestamp()});await addDoc(collection(db,'classrooms',room.id,'slides'),{index:0,image:null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});showMessage('message',`Classroom created. Code: ${code}`,'success')}catch(e){console.error(e);showMessage('message',friendlyError(e),'error')}};
document.getElementById('openCode').onclick=async()=>{const code=document.getElementById('joinCode').value.trim().toUpperCase();const snap=await getDocs(query(collection(db,'classrooms'),where('teacherId','==',me.uid),where('code','==',code)));if(snap.empty)showMessage('message','No classroom with that code belongs to you.','error');else location.href=`classroom.html?id=${snap.docs[0].id}`};
function render(target,docs){document.getElementById(target).innerHTML=docs.map(d=>{const c=d.data();return `<div class="item"><div class="row" style="justify-content:space-between"><strong>${c.name}</strong><span class="badge">${c.code}</span></div><p class="muted">${c.subject} • ${c.status}</p><div class="row"><a class="btn" href="classroom.html?id=${d.id}">Open</a>${c.status==='active'?`<button data-end="${d.id}" class="danger">End</button>`:''}</div></div>`}).join('')||'<p class="muted">None yet.</p>';document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'classrooms',b.dataset.end),{status:'ended',updatedAt:serverTimestamp()}))}
onSnapshot(query(collection(db,'classrooms'),where('teacherId','==',me.uid)),snap=>{const docs=snap.docs;render('active',docs.filter(d=>d.data().status==='active'));render('previous',docs.filter(d=>d.data().status!=='active'))});
</script></body></html>
