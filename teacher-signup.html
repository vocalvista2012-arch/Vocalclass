<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Registration | VocalClass</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap" style="max-width:520px"><div class="card"><div class="logo">Vocal<span>Class</span></div><h1>Teacher registration</h1><p class="muted">New teacher accounts require admin approval before classroom access.</p><label>Teacher name</label><input id="name" autocomplete="name"><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="new-password"><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password"><button id="signup" style="width:100%;margin-top:18px">Create teacher request</button><div id="message" class="message"></div><p class="muted"><a href="teacher-login.html">Already approved? Login</a> • <a href="index.html">Home</a></p></div></main><script type="module">
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { auth, db, serverTimestamp, friendlyError, showMessage, setLoading } from "./app-utils.js";
const btn=document.getElementById('signup');
btn.addEventListener('click',async()=>{const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;if(!name||!email||!password)return showMessage('message','Please complete every field.','error');if(password!==confirm)return showMessage('message','Passwords do not match.','error');setLoading(btn,true,'Create teacher request','Creating account...');try{const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name,email,role:'pendingTeacher',status:'pending',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});showMessage('message','Your teacher account is waiting for admin approval.','success');}catch(e){console.error(e);showMessage('message',friendlyError(e),'error')}setLoading(btn,false,'Create teacher request')});
</script></body></html>
