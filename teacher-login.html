<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | VocalClass</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap" style="max-width:500px"><div class="card"><div style="text-align:center"><div class="logo">Vocal<span>Class</span></div><h1>👨‍🏫 Teacher Login</h1><p class="muted">Approved teachers only</p></div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login" style="width:100%;margin-top:18px">Login as Teacher</button><div id="message" class="message"></div><p class="muted" style="text-align:center"><a href="teacher-signup.html">Request teacher registration</a> • <a href="index.html">Home</a></p></div></main><script type="module">
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { auth, getUserProfile, friendlyError, showMessage, setLoading } from "./app-utils.js";
const btn=document.getElementById('login');
btn.addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password)return showMessage('message','Please enter your email and password.','error');setLoading(btn,true,'Login as Teacher','Signing in...');try{const {user}=await signInWithEmailAndPassword(auth,email,password);const profile=await getUserProfile(user.uid);if(profile?.role==='teacher'&&profile?.status==='active'){location.href='teacher.html';return}if(profile?.role==='pendingTeacher')showMessage('message','Your teacher account is waiting for admin approval.','info');else showMessage('message','Teacher access is not available for this account.','error')}catch(e){console.error(e);showMessage('message',friendlyError(e),'error')}setLoading(btn,false,'Login as Teacher')});
</script></body></html>
