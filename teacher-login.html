<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teacher Login | VocalClass</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#263d91,transparent 35%),radial-gradient(circle at bottom right,#542078,transparent 35%),#080b16;color:#fff}.card{width:min(100%,450px);padding:34px;background:rgba(18,23,40,.97);border:1px solid #30384f;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.45)}.logo{text-align:center}.logo-icon{width:68px;height:68px;margin:auto;display:grid;place-items:center;border-radius:19px;background:linear-gradient(135deg,#4776ff,#9b4dff);font-size:34px;font-weight:bold}.logo h1{margin:12px 0 4px}.logo p,.sub{color:#929bb1}.sub{text-align:center;margin:0 0 25px;font-size:14px}h2{text-align:center;margin:0 0 8px}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:bold;color:#e2e6f0}.input-wrap{position:relative}.input-wrap input{padding-right:80px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #30384f;background:#0d1221;color:#fff;font-size:16px;outline:none}input:focus{border-color:#667cff;box-shadow:0 0 0 3px rgba(102,124,255,.12)}.toggle{position:absolute;right:8px;top:7px;width:auto;padding:7px 9px;background:transparent;color:#8ea0ff;font-size:12px}.toggle:hover{box-shadow:none;transform:none}.main-btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#4776ff,#8d4dff);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.main-btn:disabled{opacity:.55;cursor:not-allowed}.links{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.link-btn{background:none;border:0;color:#8ea0ff;cursor:pointer;padding:0;font-size:13px}.divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#626b82;font-size:12px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#30384f}.message{display:none;margin-top:17px;padding:12px;border-radius:10px;text-align:center;font-size:14px;line-height:1.4}.message.show{display:block}.error{color:#ff9999;background:rgba(255,70,70,.1);border:1px solid rgba(255,70,70,.25)}.success{color:#7df0aa;background:rgba(60,220,130,.1);border:1px solid rgba(60,220,130,.25)}.security{text-align:center;margin-top:20px;color:#737c94;font-size:12px}.back{display:block;text-align:center;margin-top:20px;color:#8994ad;text-decoration:none;font-size:14px}
</style>
</head>
<body><div class="card">
<div class="logo"><div class="logo-icon">V</div><h1>VocalClass</h1><p>Virtual Classroom</p></div>
<section id="loginSection"><h2>Teacher Login</h2><p class="sub">Sign in to manage your classrooms</p>
<form id="loginForm">
<div class="field"><label for="loginEmail">Email Address</label><input id="loginEmail" type="email" placeholder="teacher@example.com" autocomplete="username" required></div>
<div class="field"><label for="loginPassword">Password</label><div class="input-wrap"><input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="toggle" id="toggleLogin">Show</button></div></div>
<button class="main-btn" id="loginBtn" type="submit">Login as Teacher →</button>
<div class="links"><button type="button" class="link-btn" id="forgotBtn">Forgot password?</button><button type="button" class="link-btn" id="showSignup">Create account</button></div>
</form></section>
<section id="signupSection" hidden><h2>Create Teacher Account</h2><p class="sub">Set up your VocalClass teacher account</p>
<form id="signupForm">
<div class="field"><label for="signupName">Teacher Name</label><input id="signupName" type="text" placeholder="Your name" autocomplete="name" required></div>
<div class="field"><label for="signupEmail">Email Address</label><input id="signupEmail" type="email" placeholder="teacher@example.com" autocomplete="email" required></div>
<div class="field"><label for="signupPassword">Password</label><div class="input-wrap"><input id="signupPassword" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required><button type="button" class="toggle" id="toggleSignup">Show</button></div></div>
<button class="main-btn" id="signupBtn" type="submit">Create Teacher Account</button><div class="links"><button type="button" class="link-btn" id="showLogin">← Back to login</button></div>
</form></section>
<div id="message" class="message"></div><div class="security">🔐 Authentication protected by Firebase</div><a href="index.html" class="back">← Back to VocalClass</a>
</div>
<script type="module">
import {createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,sendPasswordResetEmail,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {auth} from "./firebase-config.js";
const $=id=>document.getElementById(id),msg=$("message");
function showMessage(text,type="error"){msg.textContent=text;msg.className="message show "+type}
function firebaseError(e){switch(e.code){case"auth/invalid-credential":return"Incorrect email or password.";case"auth/email-already-in-use":return"This email already has an account. Try logging in.";case"auth/invalid-email":return"Please enter a valid email address.";case"auth/weak-password":return"Password is too weak. Use at least 6 characters.";case"auth/operation-not-allowed":return"Email/password sign-in is not enabled in Firebase.";case"auth/too-many-requests":return"Too many attempts. Please wait and try again.";default:return"Something went wrong. Please try again."}}
onAuthStateChanged(auth,user=>{if(user)location.replace("teacher.html")});
$("toggleLogin").onclick=()=>{const i=$("loginPassword");i.type=i.type==="password"?"text":"password";$("toggleLogin").textContent=i.type==="password"?"Show":"Hide"};
$("toggleSignup").onclick=()=>{const i=$("signupPassword");i.type=i.type==="password"?"text":"password";$("toggleSignup").textContent=i.type==="password"?"Show":"Hide"};
$("showSignup").onclick=()=>{$("loginSection").hidden=true;$('signupSection').hidden=false;msg.className="message"};
$("showLogin").onclick=()=>{$("signupSection").hidden=true;$('loginSection').hidden=false;msg.className="message"};
$("loginForm").onsubmit=async e=>{e.preventDefault();const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||!password)return showMessage("Enter your email and password.");const b=$("loginBtn");b.disabled=true;b.textContent="Signing in...";try{await signInWithEmailAndPassword(auth,email,password);showMessage("Login successful! Opening Teacher Panel...","success");setTimeout(()=>location.replace("teacher.html"),700)}catch(err){showMessage(firebaseError(err))}finally{b.disabled=false;b.textContent="Login as Teacher →"}};
$("signupForm").onsubmit=async e=>{e.preventDefault();const name=$("signupName").value.trim(),email=$("signupEmail").value.trim(),password=$("signupPassword").value;if(password.length<6)return showMessage("Password must contain at least 6 characters.");const b=$("signupBtn");b.disabled=true;b.textContent="Creating account...";try{const r=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(r.user,{displayName:name});showMessage("Account created! Opening Teacher Panel...","success");setTimeout(()=>location.replace("teacher.html"),700)}catch(err){showMessage(firebaseError(err))}finally{b.disabled=false;b.textContent="Create Teacher Account"}};
$("forgotBtn").onclick=async()=>{const email=$("loginEmail").value.trim();if(!email)return showMessage("Enter your email first, then tap Forgot password.");try{await sendPasswordResetEmail(auth,email);showMessage("Password reset email sent. Check your inbox.","success")}catch(err){showMessage(firebaseError(err))}};
</script></body></html>
