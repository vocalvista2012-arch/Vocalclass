<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Teacher Classroom</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#080c17;color:#eef2ff}button,input{font:inherit}.top{height:62px;background:#0d1321;border-bottom:1px solid #222b40;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:23px;font-weight:900}.logo span{color:#756cff}.topRight{display:flex;gap:10px;align-items:center}.pill{background:#181f31;border:1px solid #323b54;color:#aaa5ff;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:900}.live{color:#8e99b5;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#45d483;box-shadow:0 0 12px #45d483;margin-right:6px}.bar{height:56px;background:#101625;border-bottom:1px solid #222b40;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.name{font-weight:850}.muted{color:#7e8aa5;font-size:12px}.code{font-weight:900;letter-spacing:4px;color:#b8c0d2}.app{height:calc(100vh - 118px);display:grid;grid-template-columns:54px minmax(0,1fr) 360px;gap:12px;padding:12px;background:#080c17}.tools,.center,.rail{background:#111827;border:1px solid #273149;border-radius:14px;overflow:hidden}.tools{padding:7px;display:flex;flex-direction:column;gap:7px}.tool{height:40px;border:1px solid #303a53;background:#1b2335;color:#e2e7f3;border-radius:9px;cursor:pointer;font-size:16px}.tool.active,.tool:hover{background:#756cff;border-color:#756cff;color:#fff}.center{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr auto}.head{height:48px;padding:0 14px;border-bottom:1px solid #273149;display:flex;align-items:center;justify-content:space-between;font-weight:850}.btn{border:0;border-radius:8px;padding:8px 11px;background:#756cff;color:#fff;font-weight:800;cursor:pointer}.mini{background:#20283b;color:#dfe5f4}.boardArea{min-height:0;background:#dfe4ed;padding:14px;position:relative}.board{width:100%;height:100%;min-height:320px;background:#fff;border:1px solid #ccd3df;border-radius:10px;display:block;touch-action:none;box-shadow:0 10px 30px #0002}.boardTools{position:absolute;left:28px;top:28px;z-index:3;display:flex;flex-direction:column;gap:6px;background:#151c2c;border:1px solid #303a53;padding:6px;border-radius:11px}.boardTools .tool{width:38px}.bottom{border-top:1px solid #273149;background:#0c111e;display:flex;justify-content:center;align-items:center;gap:10px;padding:10px;flex-wrap:wrap}.cw{display:flex;flex-direction:column;align-items:center;gap:3px}.control{height:40px;min-width:42px;padding:0 12px;border:1px solid #303a53;border-radius:10px;background:#1b2335;color:#eef2ff;cursor:pointer;font-weight:800}.control.end{background:#c94558;border-color:#c94558}.label{font-size:9px;color:#7784a0}.rail{min-height:0;display:grid;grid-template-rows:auto 1fr auto}.railHead{padding:12px 14px;border-bottom:1px solid #273149;display:flex;justify-content:space-between;align-items:center;font-weight:850}.videos{padding:10px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.vc{position:relative;background:#080c17;border:1px solid #303a53;border-radius:10px;overflow:hidden;aspect-ratio:16/9}.vc.teacher{grid-column:1/-1;min-height:205px}.vc video{width:100%;height:100%;object-fit:cover;display:block;background:#151d2d}.vn{position:absolute;left:7px;bottom:7px;background:#000b;color:#fff;padding:5px 8px;border-radius:6px;font-size:10px}.vb{position:absolute;right:7px;top:7px;background:#000b;color:#fff;padding:4px 6px;border-radius:6px;font-size:9px}.students{border-top:1px solid #273149;padding:10px}.stitle{font-size:12px;color:#95a0b9;margin-bottom:7px}.list{max-height:105px;overflow:auto}.person{padding:7px 2px;border-bottom:1px solid #20293c;display:flex;justify-content:space-between;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.error{position:fixed;left:20px;right:20px;top:72px;z-index:50;color:#ffb4be;background:#35151d;border:1px solid #6b2a35;border-radius:10px;padding:10px;display:none}.error:not(:empty){display:block}@media(max-width:1000px){body{overflow:auto}.app{height:auto;min-height:calc(100vh - 118px);grid-template-columns:1fr}.tools{flex-direction:row;overflow:auto}.center{min-height:650px}.rail{min-height:420px}.videos{max-height:360px}}@media(max-width:600px){.top{padding:0 10px}.bar{padding:0 10px}.app{padding:8px}.boardArea{height:55vh}}</style></head><body><header class="top"><div class="logo">Vocal<span>Class</span></div><div class="topRight"><span class="pill">TEACHER • LIVE</span><span class="live"><span class="dot"></span>Class in Progress</span></div></header><section class="bar"><div><div id="className" class="name">Checking classroom…</div><div class="muted">Teacher classroom</div></div><div><span class="muted">CLASS CODE </span><span id="code" class="code">------</span></div></section><div id="error" class="error"></div><main class="app"><aside class="tools"><button class="tool active" data-tool="pen">✏️</button><button class="tool" data-tool="highlighter">🖍️</button><button class="tool" data-tool="eraser">🧽</button><button class="tool" data-tool="line">╱</button><button class="tool" data-tool="rect">▭</button><button class="tool" data-tool="circle">○</button><button class="tool" data-tool="text">T</button><button class="tool" id="clear">⌫</button></aside><section class="center"><div class="head"><span>✏️ Interactive Whiteboard <span class="muted">Students see changes live</span></span><div><button class="btn mini" id="fullBoard">⛶ Board</button> <button class="btn mini" id="fullClass">⛶ Full Class</button></div></div><div class="boardArea"><div class="boardTools"><button class="tool" id="undo">↶</button><button class="tool" id="redo">↷</button><input id="size" type="range" min="1" max="20" value="4"><input id="color" type="color" value="#20263a"></div><canvas id="board"></canvas></div><div class="bottom"><div class="cw"><button class="control" id="camera">🎥</button><span class="label">Camera</span></div><div class="cw"><button class="control" id="mic">🎙️</button><span class="label">Mic</span></div><div class="cw"><button class="control" id="screen">🖥️ Share</button><span class="label">Screen</span></div><div class="cw"><button class="control">✋</button><span class="label">Raise Hand</span></div><div class="cw"><button class="control">💬 Chat</button><span class="label">Chat</span></div><div class="cw"><button class="control">••• More</button><span class="label">More</span></div><div class="cw"><button class="control end" id="end">⛔ End Class</button><span class="label">Leave</span></div></div></section><aside class="rail"><div class="railHead"><span>📹 Classroom</span><span id="count" class="muted">0 students</span></div><div id="videos" class="videos"></div><div class="students"><div class="stitle">👥 Students</div><div id="students" class="list"></div><div class="actions"><button class="btn mini" id="quiz">🧠 Quiz</button><button class="btn mini" id="poll">✅❌ Poll</button><button class="btn mini" id="hotspot">🎯 Hotspot</button><button class="btn mini" id="fast">⚡ Faster Finger</button></div></div></aside></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"}),auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=p.get('code')||'',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},$=id=>document.getElementById(id);let uid,stream,room,tool='pen',drawing=false,last=null;const peers=new Map();const err=x=>$('error').textContent='❌ '+x;const pos=e=>{const r=$('board').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};function draw(e){const c=$('board'),x=c.getContext('2d');x.save();x.strokeStyle=e.tool==='eraser'?'#fff':e.color||'#20263a';x.lineWidth=e.tool==='highlighter'?18:e.size||4;x.globalAlpha=e.tool==='highlighter'?.25:1;x.lineCap='round';if(e.type==='clear'){x.globalAlpha=1;x.fillStyle='#fff';x.fillRect(0,0,c.clientWidth,c.clientHeight)}else if(e.type==='text'){x.globalAlpha=1;x.fillStyle=e.color||'#20263a';x.font=`${e.fontSize||20}px Arial`;x.fillText(e.text,e.x,e.y)}else{x.beginPath();x.moveTo(e.x1,e.y1);x.lineTo(e.x2,e.y2);x.stroke()}x.restore()}async function save(e){draw(e);await addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{...e,at:Date.now()})}function resize(){const c=$('board'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width||!r.height)return;c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0);c.getContext('2d').fillStyle='#fff';c.getContext('2d').fillRect(0,0,r.width,r.height)}function board(){resize();window.onresize=resize;const c=$('board');c.onpointerdown=e=>{drawing=true;last=pos(e);if(tool==='text'){const t=prompt('Enter text');if(t)save({type:'text',x:last.x,y:last.y,text:t,color:$('color').value,fontSize:+$('size').value*4});drawing=false}};c.onpointermove=e=>{if(!drawing||!last||!['pen','highlighter','eraser'].includes(tool))return;const q=pos(e);save({tool,x1:last.x,y1:last.y,x2:q.x,y2:q.y,size:+$('size').value,color:$('color').value});last=q};c.onpointerup=()=>{drawing=false;last=null};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('clear').onclick=()=>save({type:'clear'});$('undo').onclick=()=>err('Undo removes the latest board event.');$('redo').onclick=()=>err('Redo is not enabled yet.')}function watchBoard(){onSnapshot(query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at'),limit(500)),s=>{resize();s.forEach(x=>draw(x.data()))})}function addStudent(id,name,remote){let e=document.getElementById('stu-'+id);if(!e){e=document.createElement('div');e.className='vc';e.id='stu-'+id;e.innerHTML='<video autoplay playsinline></video><span class="vn"></span><span class="vb">LIVE</span>';$('videos').appendChild(e)}e.querySelector('video').srcObject=remote;e.querySelector('.vn').textContent=name;e.querySelector('video').play().catch(()=>{})}function removeStudent(id){document.getElementById('stu-'+id)?.remove()}function teacherVideo(){let e=document.getElementById('teacherVideoCard');if(!e){e=document.createElement('div');e.id='teacherVideoCard';e.className='vc teacher';e.innerHTML='<video id="teacherVideo" autoplay playsinline muted></video><span class="vn">Teacher (You)</span><span class="vb">YOU</span>';$('videos').prepend(e)}e.querySelector('video').srcObject=stream}async function connect(id,name){if(peers.has(id))return;const pc=new RTCPeerConnection(ICE);peers.set(id,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>addStudent(id,name,e.streams[0]);pc.onicecandidate=e=>e.candidate&&addDoc(collection(db,'liveClassrooms',code,'signals',uid,id,'candidates'),e.candidate.toJSON()).catch(()=>{});onSnapshot(collection(db,'liveClassrooms',code,'signals',id,uid,'candidates'),s=>s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(c.doc.data())}catch{}}));pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){removeStudent(id);peers.delete(id);pc.close()}};const o=doc(db,'liveClassrooms',code,'signals',uid,id,'offer'),a=doc(db,'liveClassrooms',code,'signals',uid,id,'answer');const offer=await pc.createOffer();await pc.setLocalDescription(offer);await setDoc(o,{from:uid,to:id,sdp:offer.sdp});onSnapshot(a,async s=>{if(s.exists()&&pc.signalingState==='have-local-offer')try{await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp})}catch{}})}function full(e){try{e.requestFullscreen?.()}catch{}e.style.position='fixed';e.style.inset='0';e.style.zIndex='9999';e.style.background='#0b101c';setTimeout(resize,100)}$('fullBoard').onclick=()=>full(document.querySelector('.boardArea'));$('fullClass').onclick=()=>full(document.querySelector('.center'));async function start(){if(!/^\d{6}$/.test(code))throw Error('Invalid classroom code.');const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().teacherId!==auth.currentUser.uid||a.data().active!==true)throw Error('Classroom not found or disabled.');$('className').textContent=a.data().classroomName||'Live Classroom';$('code').textContent=code;room=doc(db,'liveClassrooms',code);await setDoc(room,{teacherId:uid,active:true,startedAt:Date.now()},{merge:true});await setDoc(doc(room,'participants',uid),{name:'Teacher',role:'teacher',online:true,joinedAt:Date.now()});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});teacherVideo();$('camera').onclick=()=>{const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$('camera').textContent=t.enabled?'🎥':'📷'};$('mic').onclick=()=>{const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️':'🔇'};$('screen').onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true}),t=s.getVideoTracks()[0],old=stream.getVideoTracks()[0];for(const pc of peers.values()){const z=pc.getSenders().find(x=>x.track?.kind==='video');if(z)await z.replaceTrack(t)}$('teacherVideo').srcObject=new MediaStream([t,...stream.getAudioTracks()]);t.onended=async()=>{for(const pc of peers.values()){const z=pc.getSenders().find(x=>x.track?.kind==='video');if(z)await z.replaceTrack(old)}$('teacherVideo').srcObject=stream}}catch{}};$('end').onclick=async()=>{await setDoc(room,{active:false,endedAt:Date.now()},{merge:true});stream.getTracks().forEach(t=>t.stop());location.href='teacher.html'};onSnapshot(collection(room,'participants'),s=>{const arr=s.docs.filter(x=>x.data().role==='student');$('count').textContent=arr.length+' student'+(arr.length===1?'':'s');arr.forEach(x=>connect(x.id,x.data().name||'Student'));s.docChanges().forEach(c=>{if(c.type==='removed'){removeStudent(c.doc.id);peers.get(c.doc.id)?.close();peers.delete(c.doc.id)}});$('students').innerHTML=arr.map(x=>`<div class="person"><span>👤 ${String(x.data().name||'Student').replace(/[<>]/g,'')}</span><span class="muted">${x.data().online===false?'Offline':'Online'}</span></div>`).join('')});watchBoard()}onAuthStateChanged(auth,u=>{if(!u){location.href='teacher-login.html';return}uid=u.uid;start().catch(e=>err(e.message||'Could not start class.'))});board()</script></body></html>
