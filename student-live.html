<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Student Live Classroom</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#fff;overflow:hidden}.top{height:56px;background:#11182b;border-bottom:1px solid #26304a;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-size:21px;font-weight:900}.logo span{color:#7168ff}.status{font-size:12px;color:#8e9ab4}.class{height:38px;background:#171f34;border-bottom:1px solid #29334e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px}.code{font-weight:900;letter-spacing:3px}.layout{height:calc(100vh - 94px);display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;padding:10px}.boardPanel,.camPanel,.chatPanel{background:#121a2d;border:1px solid #29334e;border-radius:12px;overflow:hidden}.head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #29334e;font-size:13px;font-weight:800}.boardWrap{height:calc(100% - 42px);padding:10px;background:#e9edf5}.board{width:100%;height:100%;display:block;background:#fff;border-radius:7px}.side{min-width:0;display:grid;grid-template-rows:220px minmax(0,1fr) 190px;gap:10px}.teacherVideo{width:100%;height:calc(100% - 42px);object-fit:cover;background:#050811}.teacherBox{height:100%}.students{height:calc(100% - 42px);padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto}.studentCard{position:relative;background:#050811;border-radius:8px;min-height:95px;overflow:hidden}.studentCard video{width:100%;height:100%;min-height:95px;object-fit:cover}.studentName{position:absolute;left:5px;bottom:5px;background:#000b;padding:4px 6px;border-radius:5px;font-size:11px}.empty{color:#7f8ba5;text-align:center;padding:28px 10px;font-size:12px}.chat{height:calc(100% - 42px);display:grid;grid-template-rows:1fr 45px}.messages{padding:10px;overflow:auto}.msg{margin-bottom:8px;font-size:12px}.msg b{color:#918aff}.send{display:flex;border-top:1px solid #29334e}.send input{flex:1;background:#0d1425;border:0;color:#fff;padding:10px;outline:0}.send button{width:70px;border:0;background:#635bff;color:#fff;font-weight:800}.controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#11182b;border:1px solid #29334e;border-radius:30px;padding:7px;display:flex;gap:7px;box-shadow:0 8px 30px #0007}.btn{border:0;border-radius:22px;padding:9px 13px;background:#26314b;color:#fff;font-weight:800;cursor:pointer}.btn.leave{background:#c94355}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.controls{bottom:6px}.top{padding:0 10px}}</style></head><body><header class="top"><div class="logo">Vocal<span>Class</span></div><div id="status" class="status">Connecting…</div></header><div class="class"><span id="className">Live Classroom</span><span>CODE <b id="code" class="code">------</b></span></div><main class="layout"><section class="boardPanel"><div class="head"><span>📖 Teacher Whiteboard</span><span>View only</span></div><div class="boardWrap"><canvas id="board" class="board"></canvas></div></section><aside class="side"><section class="camPanel teacherBox"><div class="head"><span>🧑‍🏫 Teacher</span><span>LIVE</span></div><video id="teacherVideo" class="teacherVideo" autoplay playsinline></video></section><section class="camPanel"><div class="head"><span>👥 Students</span><span id="count">0</span></div><div id="students" class="students"><div class="empty">Waiting for students…</div></div></section><section class="chatPanel"><div class="head"><span>💬 Class Chat</span><span class="status">Everyone in class</span></div><div class="chat"><div id="messages" class="messages"></div><form id="send" class="send"><input id="chatInput" maxlength="250" placeholder="Type a message…"><button>Send</button></form></div></section></aside></main><div class="controls"><button class="btn" id="camera">🎥 Camera</button><button class="btn" id="mic">🎙️ Mic</button><button class="btn" id="hand">✋ Raise Hand</button><button class="btn leave" id="leave">Leave</button></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});const auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=p.get('code')||'',name=sessionStorage.getItem('vocalclassStudentName')||'Student',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};let uid,stream,room,participant,teacherId='';const peers=new Map(),$=id=>document.getElementById(id);$('code').textContent=/^\d{6}$/.test(code)?code:'INVALID';function msg(t){$('status').textContent=t}function draw(e){const c=$('board'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.floor(r.width*d)||c.height!==Math.floor(r.height*d)){c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}if(e.type==='clear'){ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);return}ctx.strokeStyle=e.tool==='eraser'?'#fff':'#20263a';ctx.lineWidth=e.size||4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke()}function addStudent(id,n,s){let c=document.getElementById('s-'+id);if(!c){if($('students').querySelector('.empty'))$('students').innerHTML='';c=document.createElement('div');c.className='studentCard';c.id='s-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;c.appendChild(v);const x=document.createElement('div');x.className='studentName';x.textContent=n;c.appendChild(x);$('students').appendChild(c)}c.querySelector('video').srcObject=s}function removeStudent(id){document.getElementById('s-'+id)?.remove()}async function makePeer(remoteId,remoteName,initiator){if(peers.has(remoteId)||!stream)return;const pc=new RTCPeerConnection(ICE);peers.set(remoteId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(remoteId===teacherId)$('teacherVideo').srcObject=e.streams[0];else addStudent(remoteId,remoteName,e.streams[0])};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){pc.close();peers.delete(remoteId);if(remoteId!==teacherId)removeStudent(remoteId)}};const base=`liveClassrooms/${code}/signals/${uid}/${remoteId}`,offer=doc(db,base,'offer'),answer=doc(db,base,'answer'),mine=collection(db,base,'candidates'),theirs=collection(db,'liveClassrooms',code,'signals',remoteId,uid,'candidates');onSnapshot(theirs,s=>s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(c.doc.data())}catch{}}));pc.onicecandidate=e=>{if(e.candidate)setDoc(doc(mine),e.candidate.toJSON()).catch(()=>{})};if(initiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(offer,{from:uid,to:remoteId,sdp:o.sdp});onSnapshot(answer,async s=>{if(s.exists()&&pc.signalingState==='have-local-offer')await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp})})}else onSnapshot(offer,async s=>{if(!s.exists()||pc.currentRemoteDescription)return;await pc.setRemoteDescription({type:'offer',sdp:s.data().sdp});const a=await pc.createAnswer();await pc.setLocalDescription(a);await setDoc(answer,{from:uid,to:remoteId,sdp:a.sdp})})}async function start(){if(!/^\d{6}$/.test(code))throw Error('Invalid classroom code.');await signInAnonymously(auth);uid=auth.currentUser.uid;const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().active!==true||a.data().live!==true)throw Error('Class is not live yet.');$('className').textContent=a.data().classroomName||'Live Classroom';teacherId=a.data().teacherId;room=doc(db,'liveClassrooms',code);participant=doc(collection(room,'participants'),uid);await setDoc(participant,{name,role:'student',joinedAt:Date.now(),online:true});stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('camera').onclick=()=>{const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$('camera').textContent=t.enabled?'🎥 Camera':'📷 Camera Off'};$('mic').onclick=()=>{const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️ Mic':'🔇 Mic Off'};watch();watchBoard();watchChat();msg('Live • '+name)}function watch(){onSnapshot(collection(room,'participants'),s=>{s.docChanges().forEach(c=>{const d=c.doc.data(),id=c.doc.id;if(id===uid)return;if(c.type==='removed'){if(id!==teacherId)removeStudent(id);peers.get(id)?.close();peers.delete(id);return}const initiator=id!==teacherId&&uid<id;makePeer(id,d.name||'Participant',initiator)});const students=[...s.docs].filter(x=>x.data().role==='student');$('count').textContent=students.length})}function watchBoard(){onSnapshot(query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at','asc'),limit(500)),s=>s.docChanges().forEach(c=>{if(c.type==='added')draw(c.doc.data())}))}function watchChat(){onSnapshot(query(collection(db,'liveClassrooms',code,'chat'),orderBy('at','asc'),limit(100)),s=>{$('messages').innerHTML='';s.forEach(x=>{const d=x.data(),el=document.createElement('div');el.className='msg';el.innerHTML='<b>'+esc(d.name||'Student')+':</b> '+esc(d.text||'');$('messages').appendChild(el)});$('messages').scrollTop=$('messages').scrollHeight})}function esc(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}$('send').onsubmit=async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||!uid)return;await addDoc(collection(db,'liveClassrooms',code,'chat'),{name,text,uid,at:Date.now()});$('chatInput').value=''};$('hand').onclick=()=>{$('hand').textContent='✋ Hand Raised';$('hand').disabled=true;addDoc(collection(db,'liveClassrooms',code,'activity'),{type:'hand',name,uid,at:Date.now()}).catch(()=>{})};$('leave').onclick=async()=>{try{await deleteDoc(participant)}catch{}stream?.getTracks().forEach(t=>t.stop());location.href='student.html'};start().catch(e=>{console.error(e);alert(e.message||'Could not join live class.');location.href='student.html'})</script></body></html>
