<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VocalClass Live Class</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b16;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.top{height:60px;background:#101525;border-bottom:1px solid #29324b;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:22px;font-weight:800}.logo span{color:#7067ff}.status{font-weight:700;color:#b8bfd2}.wrap{padding:14px;max-width:1300px;margin:auto}.join,.controls{display:flex;gap:8px;flex-wrap:wrap;background:#101525;border:1px solid #29324b;border-radius:12px;padding:12px;margin-bottom:14px}.join input{flex:1;min-width:180px;background:#080d1b;border:1px solid #34405f;color:#fff;border-radius:8px;padding:11px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#7067ff;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#242d47}.btn.danger{background:#d94b5b}.btn:disabled{opacity:.5;cursor:not-allowed}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{position:relative;min-height:210px;background:#111625;border:1px solid #303b58;border-radius:12px;overflow:hidden}.card video{width:100%;height:100%;min-height:210px;object-fit:cover;background:#171e33;display:block}.name{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);padding:6px 9px;border-radius:7px;font-size:13px}.badge{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);padding:5px 8px;border-radius:7px;font-size:12px}.help{color:#aeb6ca;font-size:13px;line-height:1.5}.empty{padding:50px;text-align:center;color:#8f99b1}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5d6c;margin-right:6px}@media(max-width:600px){.wrap{padding:8px}.videos{grid-template-columns:1fr}.top{padding:0 10px}}
</style></head>
<body>
<header class="top"><div class="logo">Vocal<span>Class</span></div><div><span class="live-dot"></span><span id="status" class="status">Not connected</span></div></header>
<main class="wrap">
<section class="join"><input id="code" placeholder="Activation code e.g. VC-ABC123"><input id="name" placeholder="Your name"><button class="btn" id="joinBtn">Join Live Class</button><button class="btn secondary" id="startBtn">Start Live Class</button></section>
<div id="videos" class="videos"><div class="empty">Enter a code and join/start the class. Your browser will ask for camera and microphone permission.</div></div>
<div class="controls"><button class="btn secondary" id="cameraBtn" disabled>🎥 Camera On</button><button class="btn secondary" id="micBtn" disabled>🎙️ Mic On</button><button class="btn secondary" id="screenBtn" disabled>🖥️ Share Screen</button><button class="btn danger" id="endBtn" disabled>⛔ End / Leave</button></div>
<p class="help">Camera and microphone start only after you press Join/Start and allow the browser permission. Use HTTPS (GitHub Pages is HTTPS).</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
let uid=null,roomCode="",roomRef=null,participantRef=null,localStream=null,unsubscribe=null;const peers=new Map();
const params=new URLSearchParams(location.search),role=params.get("role")==="teacher"?"teacher":"student";const $=id=>document.getElementById(id);if(params.get("code"))$("code").value=params.get("code");if(params.get("name"))$("name").value=params.get("name");$("startBtn").style.display=role==="teacher"?"inline-block":"none";$("joinBtn").style.display=role==="teacher"?"none":"inline-block";
function status(t){$("status").textContent=t}function showError(e){console.error(e);status("❌ "+(e?.message||"Error"))}
function addVideo(id,name,stream,local=false){let card=$("card-"+id);if(!card){if($("videos").querySelector(".empty"))$("videos").innerHTML="";card=document.createElement("div");card.className="card";card.id="card-"+id;const v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.muted=local;card.appendChild(v);const n=document.createElement("div");n.className="name";n.textContent=name+(local?" (You)":"");card.appendChild(n);const b=document.createElement("div");b.className="badge";b.textContent=local?"YOU":"LIVE";card.appendChild(b);$("videos").appendChild(card)}card.querySelector("video").srcObject=stream}
function removeVideo(id){$("card-"+id)?.remove()}
async function authUser(){if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid}
async function startMedia(){if(!navigator.mediaDevices?.getUserMedia)throw Error("Camera/mic need HTTPS or localhost.");localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});addVideo(uid,$("name").value.trim()||"Participant",localStream,true);["cameraBtn","micBtn","screenBtn","endBtn"].forEach(id=>$(id).disabled=false)}
function closePeer(id){const p=peers.get(id);if(p)p.close();peers.delete(id);removeVideo(id)}
function connectPeer(remoteId,remoteName,initiator){if(peers.has(remoteId))return;const pc=new RTCPeerConnection(ICE);peers.set(remoteId,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>addVideo(remoteId,remoteName,e.streams[0]);pc.onconnectionstatechange=()=>{if(["failed","disconnected","closed"].includes(pc.connectionState))closePeer(remoteId)};
const base="liveClassrooms/"+roomCode+"/signals/"+uid+"/"+remoteId;const offerRef=doc(db,base,"offer");const answerRef=doc(db,base,"answer");const myCandidates=collection(db,base,"candidates");const remoteCandidates=collection(db,"liveClassrooms",roomCode,"signals",remoteId,uid,"candidates");
let remoteCandidateUnsub=onSnapshot(remoteCandidates,s=>s.docChanges().forEach(async ch=>{if(ch.type==="added"){try{await pc.addIceCandidate(ch.doc.data())}catch(e){console.warn(e)}}}));
const cleanup=()=>remoteCandidateUnsub();pc.addEventListener("connectionstatechange",()=>{if(pc.connectionState==="closed")cleanup()});
pc.onicecandidate=async e=>{if(e.candidate)await setDoc(doc(myCandidates),e.candidate.toJSON())};
if(initiator){(async()=>{const offer=await pc.createOffer();await pc.setLocalDescription(offer);await setDoc(offerRef,{from:uid,to:remoteId,type:"offer",sdp:offer.sdp});})()}else{onSnapshot(offerRef,async s=>{if(!s.exists()||pc.currentRemoteDescription)return;const d=s.data();if(d.to!==uid)return;await pc.setRemoteDescription({type:"offer",sdp:d.sdp});const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await setDoc(answerRef,{from:uid,to:remoteId,type:"answer",sdp:answer.sdp})});}
onSnapshot(answerRef,async s=>{if(!s.exists()||pc.currentRemoteDescription)return;const d=s.data();if(d.to!==uid)return;if(pc.signalingState!=="stable")await pc.setRemoteDescription({type:"answer",sdp:d.sdp})});}
function watch(){unsubscribe=onSnapshot(collection(roomRef,"participants"),snap=>{snap.docChanges().forEach(ch=>{const p=ch.doc.data(),id=ch.doc.id;if(id===uid)return;if(ch.type==="removed"){closePeer(id);return}connectPeer(id,p.name||"Student",uid<id)})})}
async function start(isTeacher){try{const code=$("code").value.trim().toUpperCase();if(!code)throw Error("Enter the activation code.");if(!$("name").value.trim())$("name").value=role==="teacher"?"Teacher":"Student";await authUser();roomCode=code;roomRef=doc(db,"liveClassrooms",roomCode);const room=await getDoc(roomRef);if(isTeacher){await setDoc(roomRef,{code,active:true,teacherId:uid,startedAt:serverTimestamp()},{merge:true})}else{if(!room.exists()||room.data().active!==true)throw Error("Class not live. Teacher must start it first.")}await startMedia();participantRef=doc(roomRef,"participants",uid);await setDoc(participantRef,{uid,name:$("name").value.trim(),role,isCameraOn:true,isMicOn:true,joinedAt:serverTimestamp()});watch();status("LIVE • "+code);$("joinBtn").disabled=true;$("startBtn").disabled=true}catch(e){showError(e)}}
async function leave(){try{unsubscribe?.();peers.forEach(p=>p.close());peers.clear();if(participantRef)await deleteDoc(participantRef);if(localStream)localStream.getTracks().forEach(t=>t.stop());if(role==="teacher"&&roomRef)await setDoc(roomRef,{active:false,endedAt:serverTimestamp()},{merge:true})}catch(e){console.error(e)}location.reload()}
$("startBtn").onclick=()=>start(true);$("joinBtn").onclick=()=>start(false);$("endBtn").onclick=leave;
$("cameraBtn").onclick=async()=>{const t=localStream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$("cameraBtn").textContent=t.enabled?"🎥 Camera On":"🚫 Camera Off";if(participantRef)await setDoc(participantRef,{isCameraOn:t.enabled},{merge:true})};
$("micBtn").onclick=async()=>{const t=localStream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$("micBtn").textContent=t.enabled?"🎙️ Mic On":"🔇 Mic Off";if(participantRef)await setDoc(participantRef,{isMicOn:t.enabled},{merge:true})};
$("screenBtn").onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const track=s.getVideoTracks()[0];const senderList=[];peers.forEach(pc=>pc.getSenders().forEach(x=>{if(x.track?.kind==="video")senderList.push(x)}));for(const sender of senderList)await sender.replaceTrack(track);const v=$("card-"+uid+" video");if(v)v.srcObject=new MediaStream([track,...localStream.getAudioTracks()]);track.onended=async()=>{const cam=localStream.getVideoTracks()[0];for(const sender of senderList)await sender.replaceTrack(cam);if(v)v.srcObject=localStream}}catch(e){console.log(e)}};
</script></body></html>
