<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Join</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d1c;color:#fff;font-family:Arial,sans-serif}.box{width:min(92%,480px);background:#12192d;border:1px solid #2c3858;border-radius:22px;padding:32px;box-shadow:0 20px 60px #0006}.logo{text-align:center;font-size:40px;font-weight:900}.logo span{color:#7067ff}.sub{text-align:center;color:#9da7bd;margin:8px 0 28px}h1{margin:0 0 10px}p{color:#9da7bd;line-height:1.5}.label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}input{width:100%;padding:15px;border-radius:10px;border:1px solid #35405f;background:#0b1122;color:#fff;font-size:17px;outline:0}#code{text-align:center;letter-spacing:7px;font-size:25px}.join{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#00a884;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.join:disabled{opacity:.55}.message{display:none;margin-top:15px;padding:12px;border-radius:10px}.show{display:block}.err{background:#351c24;color:#ff9aa7}.ok{background:#102d24;color:#63e6a5}.back{display:block;text-align:center;margin-top:20px;color:#938cff}</style></head><body><main class="box"><div class="logo">Vocal<span>Class</span></div><div class="sub">Live. Learn. Interact.</div><h1>👨‍🎓 Join Classroom</h1><p>Enter your name and the 6-digit code from your teacher.</p><label class="label" for="name">YOUR NAME</label><input id="name" maxlength="40" placeholder="Enter your name" autocomplete="name"><label class="label" for="code">6-DIGIT CLASS CODE</label><input id="code" maxlength="6" inputmode="numeric" placeholder="123456" autocomplete="off"><button class="join" id="join">🚀 Check & Join</button><div id="message" class="message"></div><a class="back" href="index.html">← Back to Home</a></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),show=(t,ok=false)=>{$("message").textContent=t;$('message').className='message show '+(ok?'ok':'err')};$('code').oninput=()=>{$('code').value=$('code').value.replace(/\D/g,'').slice(0,6)};async function join(){const name=$('name').value.trim(),code=$('code').value.trim();if(name.length<2)return show('⚠️ Enter your name.');if(!/^\d{6}$/.test(code))return show('⚠️ Enter exactly 6 digits.');const b=$('join');b.disabled=true;b.textContent='Connecting…';try{if(!auth.currentUser)await signInAnonymously(auth);const s=await getDoc(doc(db,'activationCodes',code));if(!s.exists()||s.data().active!==true)throw Error('That classroom code is invalid or disabled.');sessionStorage.setItem('vocalclassStudentName',name);location.href='classroom.html?role=student&code='+code}catch(e){console.error('STUDENT JOIN ERROR:',e);show('❌ '+(e.code==='permission-denied'?'Missing Firestore permission. Make sure Anonymous Authentication is enabled and Firestore Rules are published.':(e.message||'Could not join classroom.')))}finally{b.disabled=false;b.textContent='🚀 Check & Join'}}$('join').onclick=join;$('code').onkeydown=e=>{if(e.key==='Enter')join()};$('name').onkeydown=e=>{if(e.key==='Enter')$('code').focus()};</script></body></html>
