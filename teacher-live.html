<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Teacher Classroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#182033;font-family:Inter,Arial,sans-serif}.top{height:62px;background:#fff;border-bottom:1px solid #dfe4ef;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:900}.logo span{color:#635bff}.topright{display:flex;gap:10px;align-items:center}.pill{padding:7px 11px;border-radius:20px;background:#eeeaff;color:#5148d8;font-size:12px;font-weight:800}.wrap{max-width:1550px;margin:auto;padding:12px}.bar,.panel{background:#fff;border:1px solid #dfe4ef;border-radius:12px}.bar{padding:11px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.code{font-weight:900;letter-spacing:4px;font-size:18px}.muted{color:#778198;font-size:12px}.app{display:grid;grid-template-columns:58px minmax(0,1fr) 300px;gap:10px}.tools{background:#fff;border:1px solid #dfe4ef;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}.tool{height:43px;border:1px solid #d8deea;background:#f5f7fb;border-radius:8px;cursor:pointer;font-size:17px}.tool.active{background:#635bff;color:#fff}.center{min-width:0}.boardPanel{overflow:hidden}.head{padding:10px 13px;border-bottom:1px solid #e5e8f0;font-weight:800;display:flex;justify-content:space-between}.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #e5e8f0}.miniBtn,.btn{border:0;border-radius:7px;padding:8px 10px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}.miniBtn{background:#edf0f7;color:#29324a}.boardArea{background:#e9edf5;padding:10px}.board{width:100%;height:600px;background:#fff;border-radius:8px;display:block;touch-action:none}.slides{display:flex;gap:6px;padding:8px;overflow:auto}.slide{min-width:85px;height:52px;border:1px solid #ccd3e2;border-radius:7px;background:#f8f9fc;display:flex;align-items:center;justify-content:center;cursor:pointer}.slide.active{outline:2px solid #635bff}.addSlide{min-width:85px;height:52px;border:1px dashed #aeb8cb;background:#fff;border-radius:7px;cursor:pointer}.right{display:flex;flex-direction:column;gap:10px}.box{padding:10px}.box h3{font-size:13px;margin:0 0 8px}.teacherVideo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111827;border-radius:8px}.students{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:210px;overflow:auto}.student{position:relative;background:#111827;border-radius:7px;overflow:hidden}.student video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.student span{position:absolute;left:4px;bottom:4px;color:#fff;background:#000a;padding:3px 5px;border-radius:4px;font-size:10px}.list{max-height:190px;overflow:auto}.person{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #edf0f5;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bottom{margin-top:10px}.activitybar{display:flex;gap:6px;flex-wrap:wrap;padding:9px;background:#fff;border:1px solid #dfe4ef;border-radius:12px}.activity{display:none;background:#fff;border:1px solid #dfe4ef;border-radius:12px;padding:12px;margin-top:8px}.activity.show{display:block}.row{display:flex;gap:7px;flex-wrap:wrap}.input,.select,textarea{background:#f8f9fc;border:1px solid #ccd3e2;border-radius:7px;padding:9px}.input{min-width:160px}.chat{height:120px;overflow:auto;border:1px solid #e1e5ee;border-radius:7px;padding:7px;background:#fafbfe}.msg{padding:5px;border-bottom:1px solid #edf0f5;font-size:12px}.error{color:#c53046}.hidden{display:none}@media(max-width:1050px){.app{grid-template-columns:58px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{grid-template-columns:1fr}.tools{flex-direction:row;overflow:auto}.tool{min-width:43px}.right{display:block}.board{height:430px}}
</style></head><body>
<header class="top"><div class="logo">Vocal<span>Class</span></div><div class="topright"><span class="pill">TEACHER</span><span id="status" class="muted">Connecting…</span></div></header>
<main class="wrap"><section class="bar"><div><b id="className">Checking classroom…</b><div class="muted">Teacher live classroom</div></div><div><div class="muted">CLASS CODE</div><div id="code" class="code">------</div></div></section>
<div class="app"><aside class="tools">
<button class="tool active" data-tool="pen" title="Pencil">✏️</button><button class="tool" data-tool="highlighter" title="Highlighter">🖍️</button><button class="tool" data-tool="eraser" title="Eraser">🧽</button><button class="tool" data-tool="line" title="Line">╱</button><button class="tool" data-tool="rect" title="Rectangle">▭</button><button class="tool" data-tool="circle" title="Circle">○</button><button class="tool" data-tool="text" title="Text">T</button><button class="tool" id="clear" title="Clear">🗑️</button><button class="tool" id="image" title="Image">🖼️</button><button class="tool" id="video" title="Video">🎬</button><button class="tool" id="ppt" title="PPT">📑</button>
</aside>
<section class="center"><div class="panel boardPanel"><div class="head"><span>🧑‍🏫 Interactive Whiteboard</span><span class="muted">Students see the board live</span></div><div class="toolbar"><button class="miniBtn" id="undo">↶ Undo</button><button class="miniBtn" id="redo">↷ Redo</button><label class="miniBtn">Size <input id="size" type="range" min="1" max="20" value="4"></label><input id="color" type="color" value="#20263a" title="Pen color"><button class="miniBtn" id="addText">T Text</button></div><div class="boardArea"><canvas id="board" class="board"></canvas></div><div id="slides" class="slides"><div class="slide active">Slide 1</div><button class="addSlide" id="addSlide">＋ Add slide</button></div></div></section>
<aside class="right"><div class="panel box"><h3>📹 Teacher Webcam</h3><video id="teacherVideo" class="teacherVideo" autoplay playsinline muted></video></div><div class="panel box"><h3>👥 Students <span id="count">0</span></h3><div id="students" class="students"></div></div><div class="panel box"><h3>🏆 Leaderboard</h3><div id="leader" class="list"><div class="muted">Scores appear here.</div></div></div><div class="panel box"><h3>Controls</h3><div class="actions"><button class="btn" id="camera">🎥 Camera</button><button class="btn" id="mic">🎙️ Mic</button><button class="btn" id="screen">🖥️ Share</button><button class="btn" id="end">⛔ End Class</button></div></div></aside></div>
<section class="bottom"><div class="activitybar"><button class="miniBtn" id="quiz">🧠 Quiz</button><button class="miniBtn" id="poll">✅❌ Yes/No Poll</button><button class="miniBtn" id="hotspot">🎯 Hotspot</button><button class="miniBtn" id="fast">⚡ Faster Finger</button><button class="miniBtn" id="showLeader">🏆 Show Leaderboard</button><button class="miniBtn" id="graph">📈 Graph</button><button class="miniBtn" id="sheet">📋 Sheet</button><button class="miniBtn" id="model">🧊 3D Model</button></div><div id="activity" class="activity"></div><div id="error" class="error"></div></section></main>
<input id="imageFile" class="hidden" type="file" accept="image/*"><input id="videoFile" class="hidden" type="file" accept="video/*"><input id="pptFile" class="hidden" type="file" accept=".ppt,.pptx"><input id="modelFile" class="hidden" type="file" accept=".glb,.gltf,.obj">
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,serverTimestamp,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});const auth=getAuth(app),db=getFirestore(app);const p=new URLSearchParams(location.search),code=(p.get('code')||'').trim();const $=id=>document.getElementById(id);let uid,roomRef,participantRef,stream,unsub,peers=new Map(),tool='pen',drawing=false,last=null,slideIndex=0,slideCount=1;
$('code').textContent=/^\d{6}$/.test(code)?code:'INVALID';function fail(x){$('error').textContent='❌ '+x;$('status').textContent='Error'}function pos(e){const r=$('board').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function drawLine(ctx,e){ctx.strokeStyle=e.color||'#20263a';ctx.lineWidth=e.tool==='highlighter'?18:e.tool==='eraser'?25:(e.size||4);ctx.globalAlpha=e.tool==='highlighter'?.25:1;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();ctx.globalAlpha=1}
async function boardEvent(e){drawLine($('board').getContext('2d'),e);await addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{...e,slide:slideIndex,at:Date.now()}).catch(()=>{})}
function boardSetup(){const c=$('board'),ctx=c.getContext('2d');function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}resize();window.addEventListener('resize',resize);c.onpointerdown=e=>{drawing=true;last=pos(e);if(tool==='text'){const t=prompt('Enter text');if(t){ctx.fillStyle=$('color').value;ctx.font='24px Arial';ctx.fillText(t,last.x,last.y);addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{type:'text',text:t,x:last.x,y:last.y,color:$('color').value,slide:slideIndex,at:Date.now()})}drawing=false}};c.onpointermove=e=>{if(!drawing||!last||!['pen','highlighter','eraser'].includes(tool))return;const q=pos(e);boardEvent({type:'line',x1:last.x,y1:last.y,x2:q.x,y2:q.y,tool,size:+$('size').value,color:$('color').value});last=q};c.onpointerup=()=>{drawing=false;last=null};c.onpointercancel=()=>{drawing=false;last=null};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool});$('clear').onclick=async()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);await addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{type:'clear',slide:slideIndex,at:Date.now()})};$('addText').onclick=()=>tool='text';$('undo').onclick=()=>alert('Undo is prepared for the next board history pass.');$('redo').onclick=()=>alert('Redo is prepared for the next board history pass.')}
function drawEvent(e){const c=$('board'),ctx=c.getContext('2d');if(e.type==='clear'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);return}if(e.type==='line')drawLine(ctx,e);if(e.type==='text'){ctx.fillStyle=e.color||'#20263a';ctx.font='24px Arial';ctx.fillText(e.text,e.x,e.y)}}
function syncBoard(){onSnapshot(query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at'),limit(500)),s=>s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().slide===slideIndex)drawEvent(c.doc.data())}))}
function slides(){const root=$('slides');$('addSlide').onclick=async()=>{slideCount++;slideIndex=slideCount-1;renderSlides();await setDoc(doc(db,'liveClassrooms',code,'classroomState','slides'),{slideCount,slideIndex},{merge:true})};function renderSlides(){root.querySelectorAll('.slide').forEach(x=>x.remove());for(let i=0;i<slideCount;i++){const d=document.createElement('div');d.className='slide '+(i===slideIndex?'active':'');d.textContent='Slide '+(i+1);d.onclick=()=>{slideIndex=i;renderSlides()};root.insertBefore(d,$('addSlide'))}}renderSlides()}
function activity(html){$('activity').innerHTML=html;$('activity').classList.add('show')};async function publish(type,payload){await setDoc(doc(db,'liveClassrooms',code,'activity','current'),{type,payload,active:true,at:Date.now()},{merge:true})}
$('quiz').onclick=()=>{activity('<h3>🧠 Create Quiz</h3><div class="row"><input id="q" class="input" placeholder="Question"><input id="a" class="input" placeholder="Option A"><input id="b" class="input" placeholder="Option B"><input id="c" class="input" placeholder="Option C"><input id="d" class="input" placeholder="Option D"><select id="correct" class="select"><option>A</option><option>B</option><option>C</option><option>D</option></select><button class="btn" id="sendQuiz">Send</button></div>');setTimeout(()=>$('sendQuiz').onclick=()=>publish('quiz',{question:$('q').value,options:[$('a').value,$('b').value,$('c').value,$('d').value],correct:$('correct').value}),0)};
$('poll').onclick=()=>{activity('<h3>✅❌ Yes / No Poll</h3><div class="row"><input id="pollQ" class="input" placeholder="Question"><button class="btn" id="sendPoll">Start Poll</button></div>');setTimeout(()=>$('sendPoll').onclick=()=>publish('poll',{question:$('pollQ').value}),0)};
$('hotspot').onclick=()=>{activity('<h3>🎯 Hotspot</h3><div class="row"><input id="hotQ" class="input" placeholder="Ask students to click a location"><button class="btn" id="sendHot">Start</button></div>');setTimeout(()=>$('sendHot').onclick=()=>publish('hotspot',{question:$('hotQ').value}),0)};
$('fast').onclick=()=>publish('fasterFinger',{active:true});$('showLeader').onclick=()=>publish('leaderboard',{active:true});$('graph').onclick=()=>{activity('<h3>📈 Graph</h3><div class="row"><input id="labels" class="input" placeholder="Labels: A,B,C"><input id="values" class="input" placeholder="Values: 10,20,15"><button class="btn" id="sendGraph">Show</button></div>');setTimeout(()=>$('sendGraph').onclick=()=>publish('graph',{labels:$('labels').value,values:$('values').value}),0)};$('sheet').onclick=()=>{activity('<h3>📋 Sheet</h3><textarea id="sheetData" style="width:100%;min-height:100px" placeholder="Paste rows here... Name,Score"></textarea><button class="btn" id="sendSheet">Show Sheet</button>');setTimeout(()=>$('sendSheet').onclick=()=>publish('sheet',{data:$('sheetData').value}),0)};$('model').onclick=()=>$('modelFile').click();
$('image').onclick=()=>$('imageFile').click();$('video').onclick=()=>$('videoFile').click();$('ppt').onclick=()=>$('pptFile').click();$('imageFile').onchange=e=>{const f=e.target.files[0];if(f)activity('<h3>🖼️ Image</h3><p>'+escapeHtml(f.name)+'</p><img src="'+URL.createObjectURL(f)+'" style="max-width:100%;max-height:300px;border-radius:8px"><button class="btn" id="publishImage">Share to classroom</button>');setTimeout(()=>f&&$('publishImage').addEventListener('click',()=>publish('image',{name:f.name})),0)};$('videoFile').onchange=e=>{const f=e.target.files[0];if(f)activity('<h3>🎬 Video</h3><p>'+escapeHtml(f.name)+'</p><video controls style="max-width:100%;max-height:300px" src="'+URL.createObjectURL(f)+'"></video><button class="btn" id="publishVideo">Share to classroom</button>');setTimeout(()=>f&&$('publishVideo').addEventListener('click',()=>publish('video',{name:f.name})),0)};$('pptFile').onchange=e=>{const f=e.target.files[0];if(f)activity('<h3>📑 PowerPoint</h3><p>'+escapeHtml(f.name)+'</p><p class="muted">PPT selected. Firebase Storage + a slide renderer is required to deliver the actual PPT pages to every student.</p><button class="btn" id="publishPpt">Publish PPT activity</button>');setTimeout(()=>f&&$('publishPpt').addEventListener('click',()=>publish('ppt',{name:f.name})),0)};$('modelFile').onchange=e=>{const f=e.target.files[0];if(f)activity('<h3>🧊 3D Model</h3><p>'+escapeHtml(f.name)+'</p><p class="muted">GLB/GLTF/OBJ selected.</p><button class="btn" id="publishModel">Publish model</button>');setTimeout(()=>f&&$('publishModel').addEventListener('click',()=>publish('model',{name:f.name})),0)};function escapeHtml(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]||c))}
async function media(){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('teacherVideo').srcObject=stream;participantRef=doc(roomRef,'participants',uid);await setDoc(participantRef,{uid,name:'Teacher',role:'teacher',online:true,isCameraOn:true,isMicOn:true,joinedAt:serverTimestamp()},{merge:true})}
async function watch(){unsub=onSnapshot(collection(roomRef,'participants'),s=>{let n=0;const box=$('students');box.innerHTML='';s.forEach(x=>{const d=x.data();if(d.role!=='student')return;n++;const div=document.createElement('div');div.className='student';div.innerHTML='<span>'+escapeHtml(d.name||'Student')+'</span>';box.appendChild(div)});$('count').textContent=n})}
async function run(){if(!/^\d{6}$/.test(code))return fail('Invalid 6-digit classroom code.');const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().active!==true)return fail('Classroom code is invalid or disabled.');if(a.data().teacherId!==auth.currentUser.uid)return fail('This classroom belongs to another teacher.');$('className').textContent=a.data().classroomName||'VocalClass';roomRef=doc(db,'liveClassrooms',code);await setDoc(roomRef,{code,teacherId:auth.currentUser.uid,active:true,startedAt:serverTimestamp()},{merge:true});uid=auth.currentUser.uid;await media();await watch();boardSetup();syncBoard();slides();$('status').textContent='● LIVE'}
$('camera').onclick=async()=>{const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$('camera').textContent=t.enabled?'🎥 Camera':'🚫 Camera Off';await setDoc(participantRef,{isCameraOn:t.enabled},{merge:true})};$('mic').onclick=async()=>{const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️ Mic':'🔇 Mic Off';await setDoc(participantRef,{isMicOn:t.enabled},{merge:true})};$('screen').onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const t=s.getVideoTracks()[0];$('teacherVideo').srcObject=new MediaStream([t,...stream.getAudioTracks()]);t.onended=()=>$('teacherVideo').srcObject=stream}catch(e){}};$('end').onclick=async()=>{await setDoc(roomRef,{active:false,endedAt:serverTimestamp()},{merge:true});await deleteDoc(participantRef).catch(()=>{});stream?.getTracks().forEach(t=>t.stop());location.href='teacher.html'};
onAuthStateChanged(auth,async u=>{if(!u)return fail('Please sign in as teacher.');try{await run()}catch(e){console.error(e);fail(e.code==='permission-denied'?'Firestore permission denied. Publish your rules.':e.message||'Could not start classroom.')}});
</script></body></html>
