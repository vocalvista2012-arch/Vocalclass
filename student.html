<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | VocalClass</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="row" style="justify-content:space-between"><div class="logo">Vocal<span>Class</span></div><a class="btn secondary" href="index.html">Home</a></div><section class="grid" style="margin-top:28px"><div class="card"><h1>🎓 Student account</h1><label>Name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="row" style="margin-top:16px"><button id="login">Login</button><button id="register" class="green">Register</button></div><div id="message" class="message"></div></div><div class="card"><h2>Join classroom</h2><p class="muted">Login or register first, then enter the teacher's six-character code.</p><label>Classroom code</label><input id="code" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button id="join" class="green" style="width:100%;margin-top:16px">Join classroom</button><div id="joinMessage" class="message"></div><div id="profile" class="muted" style="margin-top:18px">Not signed in.</div></div></section></main><script type="module">
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { doc,setDoc,getDoc,collection,query,where,getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { auth, db, serverTimestamp, createUserProfile, getUserProfile, friendlyError, showMessage } from "./app-utils.js";
let currentUser=null, profile=null;onAuthStateChanged(auth,async u=>{currentUser=u;profile=u?await getUserProfile(u.uid):null;document.getElementById('profile').textContent=u?`Signed in as ${profile?.name||u.email} (${profile?.role||'student'})`:'Not signed in.'});
document.getElementById('register').onclick=async()=>{try{const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!name||!email||!password)return showMessage('message','Please complete name, email, and password.','error');const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});await createUserProfile(cred.user.uid,{uid:cred.user.uid,name,email,role:'student',status:'active'});showMessage('message','Student account created. You can join a class now.','success')}catch(e){console.error(e);showMessage('message',friendlyError(e),'error')}};
document.getElementById('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);showMessage('message','Student login successful.','success')}catch(e){console.error(e);showMessage('message',friendlyError(e),'error')}};
document.getElementById('join').onclick=async()=>{try{if(!currentUser)return showMessage('joinMessage','Please login or register before joining.','error');const code=document.getElementById('code').value.trim().toUpperCase();if(code.length!==6)return showMessage('joinMessage','Please enter a valid 6-character classroom code.','error');const snap=await getDocs(query(collection(db,'classrooms'),where('code','==',code),where('status','==','active')));if(snap.empty)return showMessage('joinMessage','Classroom not found or no longer active.','error');const room=snap.docs[0];await setDoc(doc(db,'classrooms',room.id,'members',currentUser.uid),{uid:currentUser.uid,displayName:profile?.name||currentUser.email,role:'student',status:'active',raisedHand:false,joinedAt:serverTimestamp()},{merge:true});location.href=`classroom.html?id=${room.id}`;}catch(e){console.error(e);showMessage('joinMessage',friendlyError(e),'error')}};
</script></body></html>
