<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Student Classroom</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101010;color:#fff}.room{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 405px;background:#111}.lesson{position:relative;min-width:0;background:#fff;display:flex;flex-direction:column}.lessonTop{height:50px;background:#fff;color:#222;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd;z-index:2}.brand{font-weight:900;font-size:20px}.brand span{color:#ff7a1a}.live{background:#ef3d4f;color:#fff;border-radius:5px;padding:6px 10px;font-size:12px;font-weight:900}.board{position:absolute;inset:50px 0 0;background:#fff}.board canvas{width:100%;height:100%;display:block}.right{min-width:0;background:#f7f7f8;display:flex;flex-direction:column;border-left:1px solid #ddd}.teacher{height:32%;min-height:210px;background:#bfc0c5;position:relative;border-bottom:2px solid #fff}.teacher video{width:100%;height:100%;object-fit:cover;background:#c8c8cb}.label{position:absolute;left:7px;bottom:7px;background:#000b;padding:5px 8px;border-radius:4px;font-size:12px;z-index:2}.teacherBadge{position:absolute;right:8px;top:8px;background:#e63950;padding:5px 7px;border-radius:5px;font-size:11px;font-weight:800}.peers{flex:1;min-height:0;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto;background:#f1f1f3}.tile{position:relative;min-height:115px;background:#c5c5c8;border-radius:5px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover;background:#202020}.tile.self{outline:2px solid #ff7a1a}.tileName{position:absolute;left:5px;bottom:5px;background:#000b;color:#fff;padding:4px 6px;border-radius:4px;font-size:11px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mutedIcon{position:absolute;right:5px;top:5px;background:#e83e56;border-radius:50%;padding:3px;font-size:10px}.bottom{height:62px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;padding:6px;z-index:4}.ctrl{border:0;background:#fff;color:#596176;font-size:11px;cursor:pointer;min-width:60px}.ctrl .ico{display:block;font-size:23px;margin-bottom:2px}.ctrl.active{color:#ff6b1a}.ctrl.leave{color:#e33b50}.chat{position:absolute;left:10px;bottom:12px;width:300px;height:175px;background:#fff;border:1px solid #ddd;border-radius:10px;display:none;flex-direction:column;color:#222;z-index:10;box-shadow:0 8px 30px #0003}.chat.open{display:flex}.chatHead{padding:8px 10px;font-weight:800;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.messages{flex:1;overflow:auto;padding:8px;font-size:12px}.msg{margin-bottom:6px}.msg b{color:#635bff}.send{display:flex;border-top:1px solid #ddd}.send input{flex:1;border:0;padding:8px;outline:0}.send button{border:0;background:#ff6b1a;color:#fff;padding:0 12px;font-weight:800}.fullscreen{position:fixed;top:10px;right:10px;z-index:30;border:0;background:#000a;color:#fff;border-radius:7px;padding:8px 10px;cursor:pointer}.joinOverlay{position:fixed;inset:0;background:#111c;display:none;place-items:center;z-index:50}.joinOverlay.show{display:grid}.joinOverlay button{border:0;background:#ff6b1a;color:#fff;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:900;cursor:pointer}@media(max-width:900px){.room{grid-template-columns:1fr}.right{position:fixed;right:0;top:0;width:min(390px,72vw);height:100vh;z-index:20;box-shadow:-10px 0 30px #0005}.lesson{height:100vh}.chat{width:min(300px,80vw)}}@media(max-width:600px){.right{width:100vw;position:relative;height:45vh}.room{display:flex;flex-direction:column;overflow:auto}.lesson{height:55vh;flex:none}.board{inset:50px 0 0}.teacher{height:150px;min-height:150px}.peers{grid-template-columns:repeat(2,1fr)}.bottom{position:fixed;left:0;right:0;bottom:0}.fullscreen{top:7px;right:7px}}</style></head><body><div class="room" id="room"><section class="lesson"><div class="lessonTop"><div><span class="brand">Vocal<span>Class</span></span> <span id="className">Live Classroom</span></div><span class="live">● LIVE</span></div><div class="board"><canvas id="boardCanvas"></canvas></div><div id="chat" class="chat"><div class="chatHead"><span>💬 Class Chat</span><button id="chatClose">×</button></div><div id="messages" class="messages"></div><form id="send" class="send"><input id="chatInput" maxlength="250" placeholder="Message…"><button>Send</button></form></div></section><aside class="right"><div class="teacher"><video id="teacherVideo" autoplay playsinline></video><div class="teacherBadge">🧑‍🏫 TEACHER • LIVE</div><div class="label" id="teacherName">Teacher</div></div><div class="peers" id="peers"><div class="tile self"><video id="selfVideo" autoplay playsinline muted></video><div class="tileName">You</div></div></div><div class="bottom"><button class="ctrl" id="chatBtn"><span class="ico">💬</span>Chat</button><button class="ctrl active" id="camera"><span class="ico">🎥</span>Camera</button><button class="ctrl active" id="mic"><span class="ico">🎙️</span>Mic</button><button class="ctrl" id="hand"><span class="ico">✋</span>Hand</button><button class="ctrl" id="fs"><span class="ico">⛶</span>Full screen</button><button class="ctrl leave" id="leave"><span class="ico">↪</span>Leave</button></div></aside></div><button class="fullscreen" id="topFs">⛶</button><div id="overlay" class="joinOverlay"><button id="enterFs">Enter Full Screen Classroom</button></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"}),auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=p.get('code')||'',name=sessionStorage.getItem('vocalclassStudentName')||'Student',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},$=id=>document.getElementById(id);let uid,stream,room,participant,teacherId='';const peers=new Map();function status(t){$('className').textContent=t}async function full(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();$('overlay').classList.remove('show')}catch{$('overlay').classList.add('show')}}$('fs').onclick=full;$('topFs').onclick=full;$('enterFs').onclick=full;function boardSize(){const c=$('boardCanvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}function draw(e){const c=$('boardCanvas'),x=c.getContext('2d'),sx=c.clientWidth/1600,sy=c.clientHeight/900;x.save();if(e.type==='clear'){x.fillStyle='#fff';x.globalAlpha=1;x.fillRect(0,0,c.clientWidth,c.clientHeight);x.restore();return}const X=v=>v*sx,Y=v=>v*sy;x.strokeStyle=e.tool==='eraser'?'#fff':e.color||'#20263a';x.fillStyle=e.color||'#20263a';x.lineWidth=(e.tool==='highlighter'?18:e.size||4)*sx;x.globalAlpha=e.tool==='highlighter'?.25:1;x.lineCap='round';if(e.type==='text'){x.globalAlpha=1;x.font=`${(e.fontSize||20)*sx}px Arial`;x.fillText(e.text,X(e.x),Y(e.y))}else if(e.shape==='line'){x.beginPath();x.moveTo(X(e.x1),Y(e.y1));x.lineTo(X(e.x2),Y(e.y2));x.stroke()}else if(e.shape==='rect'){x.strokeRect(X(e.x),Y(e.y),e.w*sx,e.h*sy)}else if(e.shape==='circle'){x.beginPath();x.ellipse(X(e.cx),Y(e.cy),Math.abs(e.rx)*sx,Math.abs(e.ry)*sy,0,0,Math.PI*2);x.stroke()}else{x.beginPath();x.moveTo(X(e.x1),Y(e.y1));x.lineTo(X(e.x2),Y(e.y2));x.stroke()}x.restore()}function clearBoard(){const c=$('boardCanvas'),x=c.getContext('2d');boardSize();x.fillStyle='#fff';x.fillRect(0,0,c.clientWidth,c.clientHeight)}function addTile(id,n,media,self=false){let el=document.getElementById('tile-'+id);if(!el){el=document.createElement('div');el.className='tile'+(self?' self':'');el.id='tile-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=self;el.appendChild(v);const l=document.createElement('div');l.className='tileName';l.textContent=self?'You':n;el.appendChild(l);$('peers').appendChild(el)}el.querySelector('video').srcObject=media;el.querySelector('video').play().catch(()=>{})}function removeTile(id){document.getElementById('tile-'+id)?.remove()}async function peer(remoteId,remoteName,initiator){if(peers.has(remoteId)||!stream)return;const pc=new RTCPeerConnection(ICE);peers.set(remoteId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(remoteId===teacherId){$('teacherVideo').srcObject=e.streams[0];$('teacherVideo').play().catch(()=>{});$('teacherName').textContent=remoteName||'Teacher'}else addTile(remoteId,remoteName,e.streams[0])};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){pc.close();peers.delete(remoteId);if(remoteId!==teacherId)removeTile(remoteId)}};const base=['liveClassrooms',code,'signals',initiator?uid:remoteId,initiator?remoteId:uid],offer=doc(db,...base,'offer'),answer=doc(db,...base,'answer'),mine=collection(db,...base,'candidates'),other=collection(db,'liveClassrooms',code,'signals',initiator?remoteId:uid,initiator?uid:remoteId,'candidates');onSnapshot(other,s=>s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(c.doc.data())}catch{}}));pc.onicecandidate=e=>{if(e.candidate)addDoc(mine,e.candidate.toJSON()).catch(()=>{})};if(initiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(offer,{from:uid,to:remoteId,sdp:o.sdp});onSnapshot(answer,async s=>{if(s.exists()&&pc.signalingState==='have-local-offer')try{await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp})}catch{}})}else onSnapshot(offer,async s=>{if(!s.exists()||pc.currentRemoteDescription)return;await pc.setRemoteDescription({type:'offer',sdp:s.data().sdp});const a=await pc.createAnswer();await pc.setLocalDescription(a);await setDoc(answer,{from:remoteId,to:uid,sdp:a.sdp})})}function watchPeople(){onSnapshot(collection(room,'participants'),s=>{const docs=s.docs,students=docs.filter(x=>x.data().role==='student');$('peers').querySelectorAll('.tile:not(.self)').forEach(x=>{if(!docs.some(d=>d.id===x.id.replace('tile-','')))x.remove()});$('count')&&($('count').textContent=students.length);docs.forEach(d=>{if(d.id===uid)return;const data=d.data(),init=data.role!=='teacher'&&uid<d.id;peer(d.id,data.name||'Participant',init)});if(!document.querySelector('.empty')&&students.length===0){} })}function watchBoard(){const q=query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at','asc'),limit(1000));onSnapshot(q,s=>{clearBoard();s.forEach(d=>draw(d.data()))});window.addEventListener('resize',()=>{clearBoard()})}function watchChat(){onSnapshot(query(collection(db,'liveClassrooms',code,'chat'),orderBy('at','asc'),limit(100)),s=>{$('messages').innerHTML='';s.forEach(d=>{const x=d.data(),m=document.createElement('div');m.className='msg';m.innerHTML='<b>'+esc(x.name||'Student')+':</b> '+esc(x.text||'');$('messages').appendChild(m)});$('messages').scrollTop=$('messages').scrollHeight})}function esc(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}$('chatBtn').onclick=()=>$('chat').classList.toggle('open');$('chatClose').onclick=()=>$('chat').classList.remove('open');$('send').onsubmit=async e=>{e.preventDefault();const t=$('chatInput').value.trim();if(t)await addDoc(collection(db,'liveClassrooms',code,'chat'),{name,text:t,uid,at:Date.now()});$('chatInput').value=''};$('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('camera').classList.toggle('active',t.enabled)}};$('mic').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mic').classList.toggle('active',t.enabled)}};$('hand').onclick=async()=>{await addDoc(collection(db,'liveClassrooms',code,'activity'),{type:'hand',name,uid,at:Date.now()});$('hand').textContent='✋ Raised'};$('leave').onclick=async()=>{try{await deleteDoc(participant)}catch{}stream?.getTracks().forEach(t=>t.stop());if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});location.href='student.html'};async function start(){if(!/^\d{6}$/.test(code))throw Error('Invalid classroom code.');await signInAnonymously(auth);uid=auth.currentUser.uid;const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().active!==true||a.data().live!==true)throw Error('Class is not live yet.');status(a.data().classroomName||'Live Classroom');teacherId=a.data().teacherId;room=doc(db,'liveClassrooms',code);participant=doc(collection(room,'participants'),uid);await setDoc(participant,{name,role:'student',joinedAt:Date.now(),online:true});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});$('selfVideo').srcObject=stream;$('selfVideo').play().catch(()=>{});watchPeople();watchBoard();watchChat();msg('Live • '+name);setTimeout(full,250)}start().catch(e=>{console.error(e);alert(e.message||'Could not join live class.');location.href='student.html'})</script></body></html>
