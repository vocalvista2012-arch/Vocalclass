<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Student Classroom</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101010;color:#fff}.room{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 405px}.lesson{position:relative;background:#fff;min-width:0}.lessonTop{height:50px;color:#222;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd}.brand{font-weight:900;font-size:20px}.brand span{color:#ff7a1a}.live{background:#ef3d4f;color:#fff;border-radius:5px;padding:6px 10px;font-size:12px;font-weight:900}.board{position:absolute;inset:50px 0 0}.board canvas{width:100%;height:100%;display:block}.right{background:#f7f7f8;border-left:1px solid #ddd;display:flex;flex-direction:column;min-width:0}.teacher{height:32%;min-height:210px;background:#bfc0c5;position:relative}.teacher video{width:100%;height:100%;object-fit:cover;background:#202020}.label{position:absolute;left:7px;bottom:7px;background:#000b;padding:5px 8px;border-radius:4px;font-size:12px}.badge{position:absolute;right:8px;top:8px;background:#e63950;padding:5px 7px;border-radius:5px;font-size:11px;font-weight:800}.peers{flex:1;min-height:0;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto;background:#f1f1f3}.tile{position:relative;min-height:115px;background:#c5c5c8;border-radius:5px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.tileName{position:absolute;left:5px;bottom:5px;background:#000b;padding:4px 6px;border-radius:4px;font-size:11px}.bottom{height:62px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around}.ctrl{border:0;background:#fff;color:#596176;font-size:11px;cursor:pointer}.ctrl .ico{display:block;font-size:23px}.ctrl.active{color:#ff6b1a}.ctrl.leave{color:#e33b50}@media(max-width:900px){.room{display:block;overflow:auto}.lesson{height:55vh}.right{height:45vh}.teacher{height:150px;min-height:150px}}@media(max-width:600px){.right{height:45vh}.teacher{height:150px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5}}</style></head><body><div class="room"><section class="lesson"><div class="lessonTop"><div><span class="brand">Vocal<span>Class</span></span> <span id="className">Live Classroom</span></div><span class="live">● LIVE</span></div><div class="board"><canvas id="boardCanvas"></canvas></div></section><aside class="right"><div class="teacher"><video id="teacherVideo" autoplay playsinline></video><div class="badge">🧑‍🏫 TEACHER • LIVE</div><div class="label" id="teacherName">Teacher</div></div><div class="peers" id="peers"><div class="tile"><video id="selfVideo" autoplay playsinline muted></video><div class="tileName">You</div></div></div><div class="bottom"><button class="ctrl active" id="camera"><span class="ico">🎥</span>Camera</button><button class="ctrl active" id="mic"><span class="ico">🎙️</span>Mic</button><button class="ctrl" id="fs"><span class="ico">⛶</span>Full screen</button><button class="ctrl leave" id="leave"><span class="ico">↪</span>Leave</button></div></aside></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"}),auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=p.get('code')||'',name=sessionStorage.getItem('vocalclassStudentName')||'Student',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},$=id=>document.getElementById(id);let uid,stream,room,participant,teacherId='';const peers=new Map();const boardSize=()=>{const c=$('boardCanvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)};const draw=e=>{const c=$('boardCanvas'),x=c.getContext('2d'),sx=c.clientWidth/1600,sy=c.clientHeight/900;if(e.type==='clear'){x.fillStyle='#fff';x.fillRect(0,0,c.clientWidth,c.clientHeight);return}x.save();x.strokeStyle=e.tool==='eraser'?'#fff':e.color||'#20263a';x.fillStyle=e.color||'#20263a';x.lineWidth=(e.tool==='highlighter'?18:e.size||4)*sx;x.globalAlpha=e.tool==='highlighter'?.25:1;x.lineCap='round';const X=v=>v*sx,Y=v=>v*sy;if(e.type==='text'){x.globalAlpha=1;x.font=`${(e.fontSize||20)*sx}px Arial`;x.fillText(e.text,X(e.x),Y(e.y))}else{x.beginPath();x.moveTo(X(e.x1),Y(e.y1));x.lineTo(X(e.x2),Y(e.y2));x.stroke()}x.restore()};const watchBoard=()=>{const q=query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at','asc'),limit(1000));onSnapshot(q,s=>{boardSize();s.forEach(d=>draw(d.data()))})};function addTile(id,n,media){let e=document.getElementById('tile-'+id);if(!e){e=document.createElement('div');e.className='tile';e.id='tile-'+id;e.innerHTML='<video autoplay playsinline></video><div class="tileName"></div>';$('peers').appendChild(e)}e.querySelector('video').srcObject=media;e.querySelector('.tileName').textContent=n;e.querySelector('video').play().catch(()=>{})}function removeTile(id){document.getElementById('tile-'+id)?.remove()}async function peer(remoteId,remoteName,isInitiator){if(peers.has(remoteId)||!stream)return;const pc=new RTCPeerConnection(ICE);peers.set(remoteId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{const media=e.streams[0]||new MediaStream([e.track]);if(remoteId===teacherId){const v=$('teacherVideo');v.srcObject=media;v.muted=false;v.autoplay=true;v.playsInline=true;v.play().catch(()=>{});$('teacherName').textContent=remoteName||'Teacher'}else addTile(remoteId,remoteName,media)};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){pc.close();peers.delete(remoteId);if(remoteId!==teacherId)removeTile(remoteId)}};const offerPath=['liveClassrooms',code,'signals',teacherId,remoteId],answerPath=['liveClassrooms',code,'signals',remoteId,teacherId],localCandidates=collection(db,'liveClassrooms',code,'signals',uid,remoteId,'candidates'),remoteCandidates=collection(db,'liveClassrooms',code,'signals',remoteId,uid,'candidates');onSnapshot(remoteCandidates,s=>s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(c.doc.data())}catch{}}));pc.onicecandidate=e=>{if(e.candidate)addDoc(localCandidates,e.candidate.toJSON()).catch(()=>{})};if(isInitiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(doc(db,...offerPath,'offer'),{from:uid,to:remoteId,sdp:o.sdp});onSnapshot(doc(db,...offerPath,'answer'),async s=>{if(s.exists()&&pc.signalingState==='have-local-offer')try{await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp})}catch{}})}else{onSnapshot(doc(db,...offerPath,'offer'),async s=>{if(!s.exists()||pc.currentRemoteDescription)return;try{await pc.setRemoteDescription({type:'offer',sdp:s.data().sdp});const a=await pc.createAnswer();await pc.setLocalDescription(a);await setDoc(doc(db,...offerPath,'answer'),{from:remoteId,to:uid,sdp:a.sdp})}catch(e){console.error(e)}})}}function watchPeople(){onSnapshot(collection(room,'participants'),s=>{s.docs.forEach(d=>{if(d.id===uid)return;const data=d.data();if(data.role==='teacher'){peer(d.id,data.name||'Teacher',false)}else{peer(d.id,data.name||'Student',uid<d.id)}});s.docChanges().forEach(c=>{if(c.type==='removed'){removeTile(c.doc.id);const pc=peers.get(c.doc.id);pc?.close();peers.delete(c.doc.id)}})})}async function start(){if(!/^\d{6}$/.test(code))throw Error('Invalid classroom code.');await signInAnonymously(auth);uid=auth.currentUser.uid;const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().active!==true||a.data().live!==true)throw Error('Class is not live yet.');$('className').textContent=a.data().classroomName||'Live Classroom';teacherId=a.data().teacherId;room=doc(db,'liveClassrooms',code);participant=doc(collection(room,'participants'),uid);await setDoc(participant,{name,role:'student',joinedAt:Date.now(),online:true});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});$('selfVideo').srcObject=stream;$('selfVideo').play().catch(()=>{});watchPeople();watchBoard();$('camera').onclick=()=>{const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$('camera').classList.toggle('active',t.enabled)};$('mic').onclick=()=>{const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mic').classList.toggle('active',t.enabled)};$('fs').onclick=()=>document.documentElement.requestFullscreen?.();$('leave').onclick=async()=>{try{await deleteDoc(participant)}catch{}stream.getTracks().forEach(t=>t.stop());location.href='student.html'}}start().catch(e=>{console.error(e);alert(e.message||'Could not join live class.');location.href='student.html'});window.addEventListener('resize',boardSize);</script></body></html>
