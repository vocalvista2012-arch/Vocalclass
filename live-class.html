<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VocalClass — Live Classroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b16;color:#fff;font-family:Arial,sans-serif}.top{height:60px;background:#101525;border-bottom:1px solid #29324b;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:22px;font-weight:900}.logo span{color:#7067ff}.status{color:#aeb6ca;font-size:14px}.wrap{max-width:1300px;margin:auto;padding:14px}.bar,.controls{background:#101525;border:1px solid #29324b;border-radius:12px;padding:12px;margin-bottom:14px}.classline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.code{font-size:22px;font-weight:900;letter-spacing:5px}.help{color:#8f99b1;font-size:13px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{position:relative;min-height:230px;background:#111625;border:1px solid #303b58;border-radius:12px;overflow:hidden}.card video{width:100%;height:100%;min-height:230px;object-fit:cover;background:#171e33;display:block}.name{position:absolute;left:8px;bottom:8px;background:#000b;padding:6px 9px;border-radius:7px;font-size:13px}.badge{position:absolute;right:8px;top:8px;background:#000b;padding:5px 8px;border-radius:7px;font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#7067ff;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#242d47}.btn.danger{background:#d94b5b}.btn:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;padding:60px;color:#8f99b1}.error{color:#ff9aa7;margin-top:10px}@media(max-width:600px){.wrap{padding:8px}.videos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="logo">Vocal<span>Class</span></div><div id="status" class="status">Connecting…</div></header>
<main class="wrap">
<section class="bar">
<div class="classline"><div><div class="help">CLASSROOM</div><div id="classCode" class="code">------</div></div><div id="className" class="help">Checking classroom…</div></div>
<div id="error" class="error"></div>
</section>
<div id="videos" class="videos"><div class="empty">Preparing camera and microphone…</div></div>
<section class="controls">
<button class="btn secondary" id="camera" disabled>🎥 Camera On</button>
<button class="btn secondary" id="mic" disabled>🎙️ Mic On</button>
<button class="btn secondary" id="screen" disabled>🖥️ Share Screen</button>
<button class="btn danger" id="leave" disabled>⛔ Leave Class</button>
</section>
<p class="help">Camera and microphone permission is requested only when you join. Use HTTPS or localhost.</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});
const auth=getAuth(app),db=getFirestore(app),ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const p=new URLSearchParams(location.search),role=p.get("role")==="teacher"?"teacher":"student",code=(p.get("code")||"").trim();
const name=role==="student"?(sessionStorage.getItem("vocalclassStudentName")||"Student"):"Teacher";
const $=id=>document.getElementById(id);let uid,roomRef,participantRef,rosterRef,stream,unsub,roomData;const peers=new Map();
$("classCode").textContent=/^\d{6}$/.test(code)?code:"INVALID";
function fail(t){$("error").textContent="❌ "+t;$("status").textContent="Error"}
function addVideo(id,n,s,local=false){let c=$("card-"+id);if(!c){if($("videos").querySelector(".empty"))$("videos").innerHTML="";c=document.createElement("div");c.className="card";c.id="card-"+id;const v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.muted=local;c.appendChild(v);const x=document.createElement("div");x.className="name";x.textContent=n+(local?" (You)":"");c.appendChild(x);const b=document.createElement("div");b.className="badge";b.textContent=local?"YOU":"LIVE";c.appendChild(b);$("videos").appendChild(c)}c.querySelector("video").srcObject=s}
function closePeer(id){const x=peers.get(id);if(x)x.close();peers.delete(id);$("card-"+id)?.remove()}
async function media(){if(!navigator.mediaDevices?.getUserMedia)throw Error("Camera requires HTTPS or localhost.");stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});addVideo(uid,name,stream,true);["camera","mic","screen","leave"].forEach(x=>$(x).disabled=false)}
async function peer(remoteId,remoteName,initiator){if(peers.has(remoteId)||!stream)return;const pc=new RTCPeerConnection(ICE);peers.set(remoteId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>addVideo(remoteId,remoteName,e.streams[0]);pc.onconnectionstatechange=()=>{if(["failed","disconnected","closed"].includes(pc.connectionState))closePeer(remoteId)};
const base=`liveClassrooms/${code}/signals/${uid}/${remoteId}`,offer=doc(db,base,"offer"),answer=doc(db,base,"answer"),mine=collection(db,base,"candidates"),theirs=collection(db,"liveClassrooms",code,"signals",remoteId,uid,"candidates");
onSnapshot(theirs,s=>s.docChanges().forEach(async c=>{if(c.type==="added"){try{await pc.addIceCandidate(c.doc.data())}catch(e){}}}));pc.onicecandidate=e=>{if(e.candidate)setDoc(doc(mine),e.candidate.toJSON()).catch(()=>{})};
if(initiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(offer,{from:uid,to:remoteId,type:"offer",sdp:o.sdp});onSnapshot(answer,async s=>{if(s.exists()&&pc.signalingState==="have-local-offer"){const d=s.data();if(d.to===uid)await pc.setRemoteDescription({type:"answer",sdp:d.sdp})}})}else{onSnapshot(offer,async s=>{if(!s.exists()||pc.currentRemoteDescription)return;const d=s.data();if(d.to!==uid)return;await pc.setRemoteDescription({type:"offer",sdp:d.sdp});const a=await pc.createAnswer();await pc.setLocalDescription(a);await setDoc(answer,{from:uid,to:remoteId,type:"answer",sdp:a.sdp})})}}
function watch(){unsub=onSnapshot(collection(roomRef,"participants"),s=>s.docChanges().forEach(c=>{const d=c.doc.data(),id=c.doc.id;if(id===uid)return;if(c.type==="removed")closePeer(id);else peer(id,d.name||"Student",uid<id)}),e=>fail("Participant list blocked by Firestore rules."))}
async function authenticate(){if(role==="student"){if(!auth.currentUser)await signInAnonymously(auth)}else if(!auth.currentUser){throw Error("Teacher login is required.")}}
async function run(){if(!/^\d{6}$/.test(code))return fail("Invalid 6-digit classroom code.");await authenticate();
const a=await getDoc(doc(db,"activationCodes",code));if(!a.exists()||a.data().active!==true)return fail("Classroom code is invalid or disabled.");roomData=a.data();$("className").textContent=roomData.classroomName||"VocalClass";
if(role==="teacher"){if(roomData.teacherId!==auth.currentUser.uid)return fail("This classroom belongs to another teacher.");await setDoc(doc(db,"liveClassrooms",code),{code,teacherId:auth.currentUser.uid,active:true,startedAt:serverTimestamp()},{merge:true})}
else{const r=await getDoc(doc(db,"liveClassrooms",code));if(!r.exists()||r.data().active!==true)return fail("The teacher has not started this class yet.")}
uid=auth.currentUser.uid;roomRef=doc(db,"liveClassrooms",code);await media();participantRef=doc(roomRef,"participants",uid);await setDoc(participantRef,{uid,name,role,online:true,isCameraOn:true,isMicOn:true,joinedAt:serverTimestamp(),lastSeen:serverTimestamp()});
if(role==="student"){rosterRef=doc(db,"classrooms",code,"students",uid);await setDoc(rosterRef,{uid,name,role:"student",online:true,isCameraOn:true,isMicOn:true,joinedAt:serverTimestamp(),lastSeen:serverTimestamp()},{merge:true})}
watch();$("status").textContent="● LIVE"}
$("camera").onclick=async()=>{const t=stream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$("camera").textContent=t.enabled?"🎥 Camera On":"🚫 Camera Off";await setDoc(participantRef,{isCameraOn:t.enabled,lastSeen:serverTimestamp()},{merge:true});if(rosterRef)await setDoc(rosterRef,{isCameraOn:t.enabled,lastSeen:serverTimestamp()},{merge:true})};
$("mic").onclick=async()=>{const t=stream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$("mic").textContent=t.enabled?"🎙️ Mic On":"🔇 Mic Off";await setDoc(participantRef,{isMicOn:t.enabled,lastSeen:serverTimestamp()},{merge:true});if(rosterRef)await setDoc(rosterRef,{isMicOn:t.enabled,lastSeen:serverTimestamp()},{merge:true})};
$("screen").onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const t=s.getVideoTracks()[0],senders=[];peers.forEach(pc=>pc.getSenders().forEach(x=>{if(x.track?.kind==="video")senders.push(x)}));for(const x of senders)await x.replaceTrack(t);const v=$("card-"+uid+" video");if(v)v.srcObject=new MediaStream([t,...stream.getAudioTracks()]);t.onended=async()=>{const cam=stream.getVideoTracks()[0];for(const x of senders)await x.replaceTrack(cam);if(v)v.srcObject=stream}}catch(e){}};
async function leave(){try{unsub?.();peers.forEach(x=>x.close());if(participantRef)await deleteDoc(participantRef);if(rosterRef)await setDoc(rosterRef,{online:false,lastSeen:serverTimestamp()},{merge:true});if(role==="teacher"&&roomRef)await setDoc(roomRef,{active:false,endedAt:serverTimestamp()},{merge:true});stream?.getTracks().forEach(t=>t.stop())}finally{location.href=role==="teacher"?"teacher.html":"student.html"}};
$("leave").onclick=leave;
onAuthStateChanged(auth,async u=>{if(role==="teacher"){if(!u)return fail("Please sign in as teacher.");try{await run()}catch(e){console.error("TEACHER CLASS ERROR:",e);fail(e.code==="permission-denied"?"Missing Firestore permission. Publish the Firestore rules and check teacher login.":e.message||"Could not start classroom.")}}else{try{await run()}catch(e){console.error("STUDENT CLASS ERROR:",e);fail(e.code==="permission-denied"?"Missing Firestore permission. Make sure Anonymous Authentication is enabled and Firestore Rules are published.":e.message||"Could not join classroom.")}}});
</script>
</body>
</html>
