<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Teacher Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182033;font-family:Arial,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid #e0e5ef;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:23px;font-weight:900}.logo span{color:#635bff}.wrap{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:18px;margin-bottom:14px}h1{margin:0 0 8px}.muted{color:#778198;font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cfd6e4;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#635bff;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.btn.danger{background:#d94b5b}.code{font-size:30px;font-weight:900;letter-spacing:7px;margin:8px 0}.students{max-height:260px;overflow:auto}.person{padding:10px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#f1efff;color:#5148d8}.err{background:#fff0f2;color:#b4233c}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="logo">Vocal<span>Class</span></div><div id="user" class="muted">Teacher</div></header><main class="wrap"><div class="grid"><section class="card"><h1>Teacher Dashboard</h1><p class="muted">Create a classroom and share the 6-digit code.</p><label>CLASSROOM NAME</label><input id="className" placeholder="e.g. Mathematics — Class 8"><button class="btn" id="create">Create Code</button><div id="message" class="msg">Ready.</div></section><section class="card"><div class="muted">CURRENT CLASSROOM</div><div id="currentName">No classroom</div><div id="currentCode" class="code">------</div><div class="muted">Students joined: <b id="count">0</b></div><button class="btn" id="start" disabled>▶ Start Live Class</button><button class="btn danger" id="disable" disabled>Disable Code</button></section></div><section class="card"><h2>👥 Students</h2><div id="students" class="students"><div class="muted">No students yet.</div></div></section></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,onSnapshot,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8d8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null,currentCode='';function newCode(){return String(Math.floor(100000+Math.random()*900000))}function message(t,ok=true){$('message').textContent=t;$('message').className='msg'+(ok?'':' err')}function show(){if(!currentCode)return;$('currentCode').textContent=currentCode;$('start').disabled=false;$('disable').disabled=false;onSnapshot(collection(db,'classrooms',currentCode,'students'),s=>{$('count').textContent=s.size;$('students').innerHTML=s.size?[...s.docs].map(x=>{const d=x.data();return `<div class="person"><span>👤 ${String(d.name||'Student').replace(/[&<>\"]/g,'')}</span><span class="muted">${d.online===false?'Offline':'Online'}</span></div>`}).join(''):'<div class="muted">No students yet.</div>'})}async function create(){if(!user)return message('Please sign in as a teacher first.',false);const name=$('className').value.trim();if(name.length<2)return message('Enter a classroom name.',false);$('create').disabled=true;try{const code=newCode();await setDoc(doc(db,'activationCodes',code),{code,teacherId:user.uid,teacherEmail:user.email||'',classroomName:name,active:true,live:false,studentCount:0,createdAt:serverTimestamp()});currentCode=code;$('currentName').textContent=name;show();message('✅ Classroom created. Share the 6-digit code with students.')}catch(e){console.error(e);message('Could not create classroom: '+(e.code||e.message),false)}finally{$('create').disabled=false}}$('create').onclick=create;$('start').onclick=async()=>{if(!currentCode)return;await setDoc(doc(db,'activationCodes',currentCode),{live:true},{merge:true});location.href='teacher-live.html?code='+encodeURIComponent(currentCode)};$('disable').onclick=async()=>{if(!currentCode)return;await setDoc(doc(db,'activationCodes',currentCode),{active:false,live:false},{merge:true});$('start').disabled=true;$('disable').disabled=true;message('Code disabled.')} ;onAuthStateChanged(auth,u=>{user=u;if(!u){location.href='teacher-login.html';return}$('user').textContent=u.email||'Teacher'})</script></body></html>
