<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VocalClass - Join Classroom</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#24205c,transparent 35%),radial-gradient(circle at bottom right,#063f48,transparent 35%),#080d1c;color:#fff}.container{width:min(92%,480px);text-align:center}.logo{font-size:42px;font-weight:800;margin-bottom:8px}.logo span{color:#7067ff}.subtitle{color:#9da7bd;margin-bottom:28px}.box{background:rgba(18,25,45,.97);border:1px solid #2c3858;border-radius:22px;padding:34px;box-shadow:0 20px 55px rgba(0,0,0,.3)}.icon{font-size:55px;margin-bottom:12px}h1{margin:0 0 10px}.description{color:#9da7bd;line-height:1.6;margin-bottom:24px}.code-label{display:block;text-align:left;color:#dce2f2;font-weight:bold;font-size:13px;margin-bottom:8px}input{width:100%;padding:16px;background:#0b1122;border:1px solid #35405f;border-radius:11px;color:#fff;font-size:24px;text-align:center;letter-spacing:7px;text-transform:uppercase;outline:none}input:focus{border-color:#7067ff;box-shadow:0 0 0 3px rgba(112,103,255,.12)}.hint{color:#707b93;font-size:12px;margin:8px 0 16px}.join{width:100%;padding:15px;border:0;border-radius:11px;background:#00a884;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.join:hover{background:#08b993}.join:disabled{opacity:.55;cursor:not-allowed}.message{margin-top:18px;padding:12px;border-radius:10px;display:none;line-height:1.4;font-size:14px}.message.show{display:block}.error{background:#351c24;color:#ff9aa7}.success{background:#102d24;color:#63e6a5}.steps{display:flex;gap:8px;margin-top:24px;text-align:left}.step{flex:1;padding:12px;border-radius:10px;background:#0e1528;border:1px solid #293452;color:#9da7bd;font-size:12px}.step b{display:block;color:#fff;margin-bottom:4px}.back{display:inline-block;margin-top:22px;color:#8d87ff;text-decoration:none}
</style>
</head>
<body><div class="container"><div class="logo">Vocal<span>Class</span></div><p class="subtitle">Live. Learn. Interact. Compete.</p><div class="box"><div class="icon">👨‍🎓</div><h1>Join Classroom</h1><p class="description">Enter the 6-character class code given by your teacher.</p><label class="code-label" for="classCode">CLASS CODE</label><input id="classCode" maxlength="6" minlength="6" placeholder="ABC123" autocomplete="off" inputmode="text" spellcheck="false"><div class="hint">6 characters • Letters and numbers</div><button class="join" id="joinBtn">🚀 Join Class</button><div id="message" class="message"></div><div class="steps"><div class="step"><b>1. Get code</b>Ask your teacher.</div><div class="step"><b>2. Enter</b>Type the code.</div><div class="step"><b>3. Join</b>Enter classroom.</div></div></div><a class="back" href="index.html">← Back to Home</a></div>
<script>
const input=document.getElementById("classCode"),btn=document.getElementById("joinBtn"),message=document.getElementById("message");
function showMessage(text,type){message.textContent=text;message.className="message show "+type}
function joinClass(){const code=input.value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){showMessage("⚠️ Enter a valid 6-character class code.","error");input.focus();return}btn.disabled=true;btn.textContent="Checking class...";showMessage("Checking your classroom code...","success");setTimeout(()=>{location.href="classroom.html?role=student&code="+encodeURIComponent(code)},500)}
input.addEventListener("input",()=>{input.value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);message.className="message"});input.addEventListener("keydown",e=>{if(e.key==="Enter")joinClass()});document.getElementById("joinBtn").addEventListener("click",joinClass);
</script></body></html>
