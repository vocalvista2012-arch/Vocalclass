<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalClass — Teacher Classroom</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#182033}.top{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:22px;font-weight:900}.logo span{color:#635bff}.pill{background:#eeeaff;color:#5148d8;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:12px}.bar,.panel{background:#fff;border:1px solid #dfe4ef;border-radius:12px}.bar{padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between}.code{font-weight:900;letter-spacing:4px}.app{display:grid;grid-template-columns:58px minmax(0,1fr) 300px;gap:10px}.tools{background:#fff;border:1px solid #dfe4ef;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}.tool{height:43px;border:1px solid #d8deea;background:#f5f7fb;border-radius:8px;cursor:pointer}.center{min-width:0}.head{padding:10px 13px;border-bottom:1px solid #e5e8f0;font-weight:800;display:flex;justify-content:space-between}.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #e5e8f0}.btn{border:0;border-radius:7px;padding:8px 10px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}.mini{background:#edf0f7;color:#29324a}.boardArea{background:#e9edf5;padding:10px}.board{width:100%;height:600px;background:#fff;border-radius:8px;display:block;touch-action:none}.right{display:flex;flex-direction:column;gap:10px}.box{padding:10px}.teacherVideo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111827;border-radius:8px}.students{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:230px;overflow:auto}.student{position:relative;background:#111827;border-radius:7px;overflow:hidden;min-height:80px}.student video{width:100%;aspect-ratio:16/9;object-fit:cover}.student span{position:absolute;left:4px;bottom:4px;color:#fff;background:#000a;padding:3px 5px;border-radius:4px;font-size:10px}.list{max-height:170px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.activitybar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.muted{color:#778198;font-size:12px}.error{color:#c53046;margin-top:8px}@media(max-width:1050px){.app{grid-template-columns:58px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{grid-template-columns:1fr}.tools{flex-direction:row;overflow:auto}.right{display:block}.board{height:430px}}</style></head><body><header class="top"><div class="logo">Vocal<span>Class</span></div><span class="pill">TEACHER • LIVE</span></header><main class="wrap"><section class="bar"><div><b id="className">Checking classroom…</b><div class="muted">Teacher live classroom</div></div><div>CODE <b id="code" class="code">------</b></div></section><div class="app"><aside class="tools"><button class="tool" data-tool="pen">✏️</button><button class="tool" data-tool="highlighter">🖍️</button><button class="tool" data-tool="eraser">🧽</button><button class="tool" data-tool="line">╱</button><button class="tool" data-tool="rect">▭</button><button class="tool" data-tool="circle">○</button><button class="tool" data-tool="text">T</button><button class="tool" id="clear">🗑️</button></aside><section class="center"><div class="panel"><div class="head"><span>🧑‍🏫 Interactive Whiteboard</span><span class="muted">Students view only</span></div><div class="toolbar"><button class="btn mini" id="undo">↶ Undo</button><button class="btn mini" id="redo">↷ Redo</button><label class="btn mini">Size <input id="size" type="range" min="1" max="20" value="4"></label><input id="color" type="color" value="#20263a"><button class="btn mini" id="text">T Text</button></div><div class="boardArea"><canvas id="board"></canvas></div></div></section><aside class="right"><div class="panel box"><div class="head"><span>📹 Teacher Webcam</span><span>LIVE</span></div><video id="teacherVideo" class="teacherVideo" autoplay playsinline muted></video></div><div class="panel box"><h3>👥 Students <span id="count">0</span></h3><div id="students" class="students"></div></div><div class="panel box"><h3>🏆 Leaderboard</h3><div class="list">Scores appear here.</div></div><div class="panel box"><div class="actions"><button class="btn" id="camera">🎥 Camera</button><button class="btn" id="mic">🎙️ Mic</button><button class="btn" id="screen">🖥️ Share</button><button class="btn" id="end">⛔ End</button></div></div></aside></div><div class="activitybar"><button class="btn mini">🧠 Quiz</button><button class="btn mini">✅❌ Poll</button><button class="btn mini">🎯 Hotspot</button><button class="btn mini">⚡ Faster Finger</button></div><div id="error" class="error"></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,addDoc,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD2WCO8qa17uGaA88x31AT-wSOEbEvAOOI",authDomain:"vocalclass-66f4d.firebaseapp.com",projectId:"vocalclass-66f4d",storageBucket:"vocalclass-66f4d.firebasestorage.app",messagingSenderId:"885399749203",appId:"1:885399749203:web:c38cd8c53e1c11cbbca6",measurementId:"G-17Y2R4S565"});const auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=p.get('code')||'',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},$=id=>document.getElementById(id);let uid,stream,teacherRef,room,peers=new Map(),tool='pen',drawing=false,last=null;function err(x){$('error').textContent='❌ '+x}function pos(e){const r=$('board').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function draw(e){const c=$('board'),ctx=c.getContext('2d');ctx.strokeStyle=e.tool==='eraser'?'#fff':e.color||'#20263a';ctx.lineWidth=e.tool==='highlighter'?18:e.size||4;ctx.globalAlpha=e.tool==='highlighter'?.25:1;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();ctx.globalAlpha=1}async function boardEvent(e){draw(e);await addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{...e,at:Date.now()}).catch(()=>{})}function board(){const c=$('board'),ctx=c.getContext('2d');function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}resize();window.onresize=resize;c.onpointerdown=e=>{drawing=true;last=pos(e);if(tool==='text'){const t=prompt('Enter text');if(t)ctx.fillText(t,last.x,last.y);drawing=false}};c.onpointermove=e=>{if(!drawing||!last||!['pen','highlighter','eraser'].includes(tool))return;const q=pos(e);boardEvent({tool,x1:last.x,y1:last.y,x2:q.x,y2:q.y,size:+$('size').value,color:$('color').value});last=q};c.onpointerup=()=>{drawing=false;last=null};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool=b.dataset.tool);$('clear').onclick=async()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);await addDoc(collection(db,'liveClassrooms',code,'signals','board','events'),{type:'clear',at:Date.now()})})}function addStudent(id,name,remote){let el=document.getElementById('stu-'+id);if(!el){el=document.createElement('div');el.className='student';el.id='stu-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;el.appendChild(v);const s=document.createElement('span');s.textContent=name;el.appendChild(s);$('students').appendChild(el)}el.querySelector('video').srcObject=remote;el.querySelector('video').play().catch(()=>{})}function removeStudent(id){document.getElementById('stu-'+id)?.remove()}async function connectStudent(studentId,name){if(peers.has(studentId)||!stream)return;const pc=new RTCPeerConnection(ICE);peers.set(studentId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));const base=`liveClassrooms/${code}/signals/${uid}/${studentId}`,offer=doc(db,base,'offer'),answer=doc(db,base,'answer'),mine=collection(db,base,'candidates'),theirs=collection(db,'liveClassrooms',code,'signals',studentId,uid,'candidates');pc.onicecandidate=e=>{if(e.candidate)setDoc(doc(mine),e.candidate.toJSON()).catch(()=>{})};onSnapshot(theirs,s=>s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(c.doc.data())}catch{}}));pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){pc.close();peers.delete(studentId)}};const o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(offer,{from:uid,to:studentId,sdp:o.sdp});onSnapshot(answer,async s=>{if(s.exists()&&pc.signalingState==='have-local-offer')try{await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp})}catch(e){console.error(e)}})}async function start(){if(!/^\d{6}$/.test(code))throw Error('Invalid classroom code.');const a=await getDoc(doc(db,'activationCodes',code));if(!a.exists()||a.data().teacherId!==auth.currentUser.uid||a.data().active!==true)throw Error('Classroom not found or disabled.');$('className').textContent=a.data().classroomName||'Live Classroom';$('code').textContent=code;room=doc(db,'liveClassrooms',code);await setDoc(room,{teacherId:uid,active:true,startedAt:Date.now()},{merge:true});teacherRef=doc(room,'participants',uid);await setDoc(teacherRef,{name:'Teacher',role:'teacher',joinedAt:Date.now(),online:true});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});$('teacherVideo').srcObject=stream;await $('teacherVideo').play().catch(()=>{});if(!stream.getVideoTracks().length)throw Error('Camera stream has no video track.');watchStudents();watchBoard();$('camera').onclick=()=>{const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$('camera').textContent=t.enabled?'🎥 Camera':'📷 Camera Off'};$('mic').onclick=()=>{const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️ Mic':'🔇 Mic Off'};$('screen').onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const t=s.getVideoTracks()[0],old=stream.getVideoTracks()[0];for(const pc of peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(t)}$('teacherVideo').srcObject=new MediaStream([t,...stream.getAudioTracks()]);t.onended=async()=>{for(const pc of peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(old)}$('teacherVideo').srcObject=stream}}catch(e){console.error(e)}};$('end').onclick=async()=>{await setDoc(doc(db,'activationCodes',code),{live:false},{merge:true});await setDoc(room,{active:false},{merge:true});stream.getTracks().forEach(t=>t.stop());location.href='teacher.html'}}async function watchStudents(){onSnapshot(collection(room,'participants'),s=>{const arr=[...s.docs].filter(x=>x.data().role==='student');$('count').textContent=arr.length;arr.forEach(x=>connectStudent(x.id,x.data().name||'Student'));s.docChanges().forEach(c=>{if(c.type==='removed')removeStudent(c.doc.id)})})}function watchBoard(){onSnapshot(query(collection(db,'liveClassrooms',code,'signals','board','events'),orderBy('at'),limit(500)),s=>s.docChanges().forEach(c=>{if(c.type==='added'){const e=c.doc.data();if(e.type==='clear'){const ctx=$('board').getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,$('board').clientWidth,$('board').clientHeight)}else draw(e)}}))}onAuthStateChanged(auth,u=>{if(!u){location.href='teacher-login.html';return}uid=u.uid;start().catch(e=>{console.error(e);err(e.message||'Could not start class.')})});board()</script></body></html>
