<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocalClass - Join Classroom</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #24205c, transparent 35%),
        radial-gradient(circle at bottom right, #063f48, transparent 35%),
        #080d1c;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #7067ff;
    }

    .subtitle {
      color: #9da7bd;
      margin-bottom: 30px;
    }

    .box {
      background: #12192d;
      border: 1px solid #2c3858;
      border-radius: 22px;
      padding: 35px;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #9da7bd;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 16px;
      background: #0b1122;
      border: 1px solid #35405f;
      border-radius: 11px;
      color: white;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #7067ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #00a884;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #08b993;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .error {
      display: block;
      background: #351c24;
      color: #ff8e9d;
    }

    .success {
      display: block;
      background: #102d24;
      color: #63e6a5;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #8d87ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Vocal<span>Class</span>
    </div>

    <p class="subtitle">
      Live. Learn. Interact. Compete.
    </p>

    <div class="box">

      <div class="icon">👨‍🎓</div>

      <h1>Join Classroom</h1>

      <p class="description">
        Enter the 6-character class code given by your teacher.
      </p>

      <input
        id="classCode"
        type="text"
        maxlength="6"
        placeholder="ABC123"
        autocomplete="off"
      >

      <button onclick="joinClass()">
        🚀 Join Class
      </button>

      <div id="message" class="message"></div>

    </div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>


  <script>

    function joinClass() {

      const input =
        document.getElementById("classCode");

      const message =
        document.getElementById("message");

      const code =
        input.value.trim().toUpperCase();

      if (code.length !== 6) {

        message.className = "message error";

        message.textContent =
          "⚠️ Please enter a valid 6-character class code.";

        return;
      }

      message.className = "message success";

      message.textContent =
        "✅ Class found! Joining as student...";

      setTimeout(() => {

        window.location.href =
          "classroom.html?role=student&code=" + code;

      }, 800);
    }


    document
      .getElementById("classCode")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          joinClass();
        }

      });

  </script>

</body>
</html>
