<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom | VocalClass</title><link rel="stylesheet" href="styles.css"><style>body{overflow:hidden}.room{height:calc(100vh - 68px);display:grid;grid-template-columns:150px 1fr 320px}.slides,.side{background:#101525;border-right:1px solid #29324b;overflow:auto;padding:10px}.stage{display:flex;flex-direction:column;background:white;color:#111;min-width:0}.canvasWrap{position:relative;flex:1}canvas{width:100%;height:100%;display:block;background:white}.toolbar{min-height:70px;background:#101525;border-top:1px solid #29324b;display:flex;gap:7px;align-items:center;overflow:auto;padding:8px}.tool{min-width:42px;padding:10px}.slideThumb{background:#17203a;color:white;border:1px solid #34405f;border-radius:10px;margin-bottom:8px;padding:16px;cursor:pointer}.slideThumb.active{border-color:#8179ff}.video{height:180px;background:radial-gradient(circle,#283453,#111625);display:grid;place-items:center;border-radius:14px;margin-bottom:12px}.chatMsgs{height:190px;overflow:auto}.chatMsg{background:#171e33;border-radius:10px;padding:9px;margin-bottom:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:5}.modal.show{display:grid}.modal .card{width:min(520px,92%)}@media(max-width:900px){body{overflow:auto}.room{height:auto;grid-template-columns:1fr}.stage{height:60vh}.side{border-top:1px solid #29324b}}</style></head><body><header class="topbar"><div class="logo">Vocal<span>Class</span></div><div class="row"><span id="roomTitle" class="badge">Loading...</span><span id="role" class="badge"></span><button id="leave">Leave</button></div></header><main class="room"><aside class="slides"><h3>Slides</h3><div id="slideList"></div></aside><section class="stage"><div class="canvasWrap"><canvas id="board"></canvas></div><div id="teacherTools" class="toolbar"><button class="tool" data-tool="pen">✏️</button><button class="tool" data-tool="highlighter">🖍️</button><button class="tool" data-tool="eraser">🧹</button><button class="tool" data-tool="pointer">🔦</button><button class="tool" data-tool="text">T</button><button class="tool" data-tool="rect">▭</button><button class="tool" data-tool="circle">○</button><input id="color" type="color" value="#111111" style="width:48px"><input id="size" type="range" min="1" max="30" value="4" style="width:90px"><button id="undo">↩️</button><button id="redo">↪️</button><button id="image">🖼️</button><button id="pdf">📄</button><input id="file" type="file" accept="image/*,.pdf" hidden><button id="addSlide">＋</button><button id="deleteSlide">🗑️</button><button id="clear">🧽</button><button id="poll">📊 Poll</button><button id="quiz">❓ Quiz</button><button id="mic">🎤</button><button id="cam">📷</button><button id="screen">🖥️</button><button id="end" class="danger">End class</button></div><div id="studentTools" class="toolbar hidden"><button id="raise">✋ Raise Hand</button><button id="leave2">Leave classroom</button></div></section><aside class="side"><div class="video"><video id="localVideo" autoplay muted playsinline style="max-width:100%;max-height:100%"></video><span id="videoText">Teacher video / screen preview</span></div><div id="hands" class="panel"><h3>Raised hands</h3><div id="handList" class="muted">None</div></div><div class="panel"><h3>Chat</h3><div id="chatMsgs" class="chatMsgs"></div><div class="row"><input id="chatInput" maxlength="300" placeholder="Message"><button id="send">➤</button></div></div><div class="panel"><h3>Live poll</h3><div id="pollArea" class="muted">No active poll.</div></div><div class="panel"><h3>Live quiz</h3><div id="quizArea" class="muted">No active quiz.</div></div></aside></main><div id="modal" class="modal"><div class="card"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="row" style="margin-top:14px"><button id="modalSave">Save</button><button id="modalClose" class="secondary">Cancel</button></div></div></div><div id="message" class="message" style="position:fixed;left:20px;bottom:20px;max-width:420px"></div><script type="module">
import { doc,getDoc,setDoc,addDoc,collection,query,orderBy,onSnapshot,updateDoc,serverTimestamp,where,getDocs,deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { auth, db, requireRole, logout, friendlyError, showMessage } from "./app-utils.js";
const id=new URLSearchParams(location.search).get('id');if(!id) location.href='index.html';let ctx,canvas=document.getElementById('board'),me,profile,room,isTeacher=false,slides=[],current=0,tool='pen',drawing=false,last=[],undoStack=[],redoStack=[],syncTimer=null;({user:me,profile}=await requireRole(['teacher','student'],{redirect:'index.html'}));room=(await getDoc(doc(db,'classrooms',id))).data();if(!room) location.href='index.html';const member=await getDoc(doc(db,'classrooms',id,'members',me.uid));isTeacher=room.teacherId===me.uid&&profile.role==='teacher';if(!isTeacher&&!member.exists()) location.href='student-login.html';document.getElementById('role').textContent=isTeacher?'👨‍🏫 Teacher':'🎓 Student';document.getElementById('teacherTools').classList.toggle('hidden',!isTeacher);document.getElementById('studentTools').classList.toggle('hidden',isTeacher);document.getElementById('hands').classList.toggle('hidden',!isTeacher);document.getElementById('roomTitle').textContent=`${room.name} • Code ${room.code}`;document.getElementById('leave').onclick=logout;document.getElementById('leave2').onclick=()=>location.href='student-login.html';ctx=canvas.getContext('2d');function resize(){const img=canvas.toDataURL();canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;paint(img)}function paint(data){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,canvas.width,canvas.height);im.src=data}}resize();addEventListener('resize',resize);
function saveSync(){if(!isTeacher)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{const s=slides[current];if(s) updateDoc(doc(db,'classrooms',id,'slides',s.id),{image:canvas.toDataURL('image/png'),updatedAt:serverTimestamp()});},650)}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{if(!isTeacher)return;const p=pos(e);if(tool==='text'){const t=prompt('Text to add');if(t){undoStack.push(canvas.toDataURL());ctx.fillStyle=document.getElementById('color').value;ctx.font='24px Arial';ctx.fillText(t,p.x,p.y);saveSync()}return}drawing=true;last=[p.x,p.y];undoStack.push(canvas.toDataURL());canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing||!isTeacher)return;const p=pos(e);ctx.lineWidth=+document.getElementById('size').value;ctx.lineCap='round';ctx.strokeStyle=document.getElementById('color').value;ctx.globalAlpha=tool==='highlighter'?.25:1;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p.x,p.y);ctx.stroke();last=[p.x,p.y]};canvas.onpointerup=()=>{if(drawing){drawing=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';saveSync()}};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool=b.dataset.tool);document.getElementById('undo').onclick=()=>{const u=undoStack.pop();if(u){redoStack.push(canvas.toDataURL());paint(u);saveSync()}};document.getElementById('redo').onclick=()=>{const r=redoStack.pop();if(r){undoStack.push(canvas.toDataURL());paint(r);saveSync()}};document.getElementById('clear').onclick=()=>{undoStack.push(canvas.toDataURL());paint();saveSync()};
onSnapshot(query(collection(db,'classrooms',id,'slides'),orderBy('index')),snap=>{slides=snap.docs.map(d=>({id:d.id,...d.data()}));if(!slides.length&&isTeacher)addDoc(collection(db,'classrooms',id,'slides'),{index:0,image:null,createdAt:serverTimestamp()});renderSlides();paint(slides[current]?.image)});function renderSlides(){document.getElementById('slideList').innerHTML=slides.map((s,i)=>`<div class="slideThumb ${i===current?'active':''}" data-i="${i}">Slide ${i+1}</div>`).join('');document.querySelectorAll('.slideThumb').forEach(el=>el.onclick=()=>{current=+el.dataset.i;if(isTeacher)updateDoc(doc(db,'classrooms',id),{currentSlide:current});renderSlides();paint(slides[current]?.image)})}onSnapshot(doc(db,'classrooms',id),s=>{const data=s.data();if(!isTeacher&&Number.isInteger(data?.currentSlide)){current=data.currentSlide;renderSlides();paint(slides[current]?.image)}});document.getElementById('addSlide').onclick=()=>addDoc(collection(db,'classrooms',id,'slides'),{index:slides.length,image:null,createdAt:serverTimestamp()});document.getElementById('deleteSlide').onclick=()=>{if(slides.length>1)deleteDoc(doc(db,'classrooms',id,'slides',slides[current].id))};
document.getElementById('image').onclick=()=>document.getElementById('file').click();document.getElementById('pdf').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)return showMessage('message','Please use files smaller than 5MB.','error');if(f.type==='application/pdf')return showMessage('message','PDF selected. Browser PDF-to-canvas conversion requires a PDF renderer library; upload is intentionally not faked.','info');const reader=new FileReader();reader.onload=()=>{undoStack.push(canvas.toDataURL());paint(reader.result);setTimeout(saveSync,200)};reader.readAsDataURL(f)};
async function sendChat(){const text=document.getElementById('chatInput').value.trim();if(!text)return;await addDoc(collection(db,'classrooms',id,'messages'),{userId:me.uid,displayName:profile.name||me.email,message:text.slice(0,300),createdAt:serverTimestamp()});document.getElementById('chatInput').value=''}document.getElementById('send').onclick=sendChat;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')sendChat()};onSnapshot(query(collection(db,id?'classrooms/'+id+'/messages':'x'),orderBy('createdAt')),snap=>document.getElementById('chatMsgs').innerHTML=snap.docs.map(d=>`<div class="chatMsg"><strong>${d.data().displayName}</strong><p>${d.data().message}</p></div>`).join(''));
document.getElementById('raise').onclick=()=>setDoc(doc(db,'classrooms',id,'members',me.uid),{raisedHand:true,displayName:profile.name||me.email,role:'student',status:'active',updatedAt:serverTimestamp()},{merge:true});onSnapshot(query(collection(db,'classrooms',id,'members'),where('raisedHand','==',true)),snap=>document.getElementById('handList').innerHTML=snap.docs.map(d=>`<div class="row">✋ ${d.data().displayName}<button data-clear="${d.id}">Clear</button></div>`).join('')||'None');document.addEventListener('click',e=>{if(e.target.dataset.clear)updateDoc(doc(db,'classrooms',id,'members',e.target.dataset.clear),{raisedHand:false})});
function modal(title,body,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show');document.getElementById('modalSave').onclick=onSave}document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('poll').onclick=()=>modal('Create poll','<input id=q placeholder=Question><input id=a placeholder=A><input id=b placeholder=B><input id=c placeholder=C><input id=d placeholder=D>',async()=>{await addDoc(collection(db,'classrooms',id,'polls'),{question:q.value,choices:[a.value,b.value,c.value,d.value],active:true,createdAt:serverTimestamp()});document.getElementById('modal').classList.remove('show')});document.getElementById('quiz').onclick=()=>modal('Create quiz','<input id=q placeholder=Question><input id=a placeholder=A><input id=b placeholder=B><input id=c placeholder=C><input id=d placeholder=D><select id=correct><option>0</option><option>1</option><option>2</option><option>3</option></select>',async()=>{await addDoc(collection(db,'classrooms',id,'quizzes'),{question:q.value,choices:[a.value,b.value,c.value,d.value],correctIndex:+correct.value,active:true,createdAt:serverTimestamp()});document.getElementById('modal').classList.remove('show')});async function media(kind){try{const stream=kind==='screen'?await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}):await navigator.mediaDevices.getUserMedia({video:kind==='cam',audio:kind==='mic'});localVideo.srcObject=stream;videoText.style.display='none';showMessage('message',`${kind} preview started. Multi-user WebRTC still needs Firebase signaling and peer connection wiring.`, 'info')}catch(e){showMessage('message','Media permission was cancelled or unavailable.','error')}};document.getElementById('mic').onclick=()=>media('mic');document.getElementById('cam').onclick=()=>media('cam');document.getElementById('screen').onclick=()=>media('screen');document.getElementById('end').onclick=()=>updateDoc(doc(db,'classrooms',id),{status:'ended',updatedAt:serverTimestamp()});
</script></body></html>
